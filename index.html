<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Premios AGESPORT Andalucía 2025</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",sans-serif;background:#F1F8E9;color:#1A1A1A;min-height:100vh}
.hdr{background:#1B5E20;padding:0 20px;display:flex;align-items:center;justify-content:space-between;min-height:58px;flex-wrap:wrap;gap:6px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.hdr-t{font-family:"Playfair Display",serif;color:white;font-size:15px;font-weight:700}
.hdr-s{color:#C8E6C9;font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.tabs{background:#155015;padding:0 20px;display:flex;gap:2px;flex-wrap:wrap}
.tb{padding:7px 14px;border:none;cursor:pointer;border-radius:5px 5px 0 0;font-family:"DM Sans",sans-serif;font-size:12px;font-weight:600;transition:all .2s}
.tb.on{background:#F1F8E9;color:#1B5E20}
.tb.off{background:rgba(255,255,255,.12);color:rgba(255,255,255,.75)}
.tb.off:hover{background:rgba(255,255,255,.22)}
.main{padding:18px;max-width:860px;margin:0 auto;width:100%}
.card{background:white;border-radius:14px;padding:20px;box-shadow:0 2px 12px rgba(27,94,32,.07);margin-bottom:16px}
.ct{font-family:"Playfair Display",serif;font-size:18px;font-weight:700;color:#1B5E20;margin-bottom:5px}
.cs{font-size:12px;color:#757575;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 15px;border:none;border-radius:7px;font-family:"DM Sans",sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.bp{background:#1B5E20;color:white}.bp:hover{background:#2E7D32;transform:translateY(-1px)}
.bs{background:#EEEEEE;color:#333}.bs:hover{background:#E0E0E0}
.bd{background:#FFEBEE;color:#C62828}.bd:hover{background:#FFCDD2}
.ba{background:#FFF8E1;color:#E65100}.ba:hover{background:#FFECB3}
.bf{width:100%;justify-content:center;padding:11px;font-size:14px}
.bsm{padding:4px 10px;font-size:11px}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.inp,.ta,.sel{width:100%;padding:9px 12px;border:2px solid #E8F5E9;border-radius:7px;font-family:"DM Sans",sans-serif;font-size:13px;color:#1A1A1A;outline:none;background:#F8FBF8;transition:border-color .2s}
.inp:focus,.ta:focus,.sel:focus{border-color:#4CAF50;background:white}
.ta{resize:vertical;min-height:80px;line-height:1.5}
.lbl{font-size:11px;font-weight:600;color:#757575;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.sb{background:#F1F8E9;border-radius:10px;padding:14px;text-align:center}
.sn{font-family:"Playfair Display",serif;font-size:28px;font-weight:900;color:#1B5E20}
.sl{font-size:11px;color:#757575;margin-top:2px}
.cn{width:28px;height:28px;border-radius:50%;background:#F1F8E9;color:#1B5E20;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.vc{border:2px solid #E8F5E9;border-radius:12px;overflow:hidden;margin-bottom:12px}
.vc.vt{border-color:#4CAF50}
.vch{background:#F1F8E9;padding:11px 16px;display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.vch:hover{background:#E8F5E9}
.vcp{padding:10px 16px}
.vo{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-radius:8px;border:2px solid transparent;margin-bottom:5px;cursor:pointer;background:#F8F8F8;transition:all .15s}
.vo:hover{border-color:#C8E6C9;background:#F1F8E9}
.vo.sel{border-color:#1B5E20;background:#F1F8E9}
.vr{width:18px;height:18px;border-radius:50%;border:2px solid #BDBDBD;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px;transition:all .15s}
.vo.sel .vr{border-color:#1B5E20;background:#1B5E20}
.vrd{width:7px;height:7px;border-radius:50%;background:white}
.vmot{font-size:11px;color:#1B5E20;cursor:pointer;border:1px solid #A5D6A7;border-radius:15px;background:#F1F8E9;padding:3px 8px;font-weight:600;white-space:nowrap;margin-left:auto;flex-shrink:0}
.varg{margin-top:7px;padding:8px 10px;background:#F9FBE7;border-left:3px solid #66BB6A;border-radius:0 7px 7px 0;font-size:12px;color:#424242;line-height:1.55;display:none}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600}
.bg{background:#C8E6C9;color:#1B5E20}
.ba2{background:#FFF3E0;color:#E65100}
.ep{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:18px;font-size:11px;font-weight:600}
.ea{background:#E8F5E9;color:#1B5E20}
.ec{background:#FFEBEE;color:#C62828}
.dl{width:7px;height:7px;border-radius:50%;background:#4CAF50;animation:pu 1.4s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.35}}
.em{text-align:center;padding:36px 16px;color:#757575}
.lw{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#F1F8E9,#E8F5E9);padding:16px}
.lc{background:white;border-radius:16px;padding:34px 30px;max-width:400px;width:100%;box-shadow:0 6px 32px rgba(27,94,32,.12);text-align:center}
.lt{font-family:"Playfair Display",serif;font-size:22px;font-weight:900;color:#1B5E20;margin-bottom:6px}
.lsu{font-size:13px;color:#757575;margin-bottom:22px;line-height:1.5}
.lf{margin-bottom:11px;text-align:left}
.lav{background:#FFF8E1;border:1px solid #FFD54F;border-radius:7px;padding:8px 11px;font-size:11px;color:#E65100;margin-bottom:14px;text-align:left;line-height:1.4}
.ler{background:#FFEBEE;border:1px solid #FFCDD2;border-radius:7px;padding:8px 11px;font-size:12px;color:#C62828;margin-bottom:12px;font-weight:500;display:none;text-align:left}
.apf{display:none;margin-bottom:11px;text-align:left}
.cc{font-size:11px;color:#757575;text-align:right;margin-top:2px}
.rrow{margin-bottom:10px}
.bb{height:8px;background:#F5F5F5;border-radius:8px;overflow:hidden}
.br{height:100%;border-radius:8px;transition:width .5s}
.citem{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:#F5F5F5;border-radius:7px;margin-bottom:5px}
.divline{height:1px;background:#E8F5E9;margin:14px 0}
@media(max-width:580px){.main{padding:10px}.g2,.g3{grid-template-columns:1fr}.hdr{padding:0 12px}.tabs{padding:0 8px}.tb{padding:6px 10px;font-size:11px}}
</style>
</head>

var U=null,estado="abierta",votos={},socios=[],props=[],sel={};
var fechaInicio="2026-09-22",fechaFin="2026-10-05";

function q(id){return document.getElementById(id)}
function sk(s){return s.replace(/[.#$\[\]]/g,"_")}
function fget(p,cb){db.ref(p).once("value").then(function(s){cb(s.val())})}
function fset(p,v){return db.ref(p).set(v)}
function fpush(p,v){return db.ref(p).push(v)}

function init(){
  fget("estado",function(v){estado=v||"abierta"});
  fget("fechas",function(v){if(v){fechaInicio=v.inicio||fechaInicio;fechaFin=v.fin||fechaFin;}});
  fget("votos",function(v){votos=v||{}});
  fget("socios",function(v){socios=v?Object.values(v):[]});
  fget("propuestas",function(v){
    props=v?Object.values(v):[];
    props.filter(function(p){return p.aprobada}).forEach(addPropToCat);
  });
  // Cargar lista de emails autorizados desde Firebase (si existe, sobreescribe la lista hardcoded)
  fget("emails_auth",function(v){
    if(v&&Array.isArray(v)&&v.length>0) SOCIOS_AUTH=v;
    else if(v&&typeof v==="object") SOCIOS_AUTH=Object.values(v);
  });
  db.ref("votos").on("value",function(s){
    votos=s.val()||{};
    if(q("main")&&q("main").dataset.v==="res") showRes();
  });
  db.ref("estado").on("value",function(s){estado=s.val()||"abierta"});
  db.ref("fechas").on("value",function(s){var v=s.val();if(v){fechaInicio=v.inicio||fechaInicio;fechaFin=v.fin||fechaFin;}});
  db.ref("socios").on("value",function(s){socios=s.val()?Object.values(s.val()):[]});
  setTimeout(showLogin,350);
}

function addPropToCat(p){
  var cat=CATS.find(function(c){return c.id===p.catId});
  if(!cat)return;
  var ex=cat.cands.find(function(c){return c.n===p.nombre});
  if(!ex) cat.cands.push({n:p.nombre,m:p.municipio,a:p.argumento||"",p:true});
}
function remPropFromCat(nombre,catId){
  var cat=CATS.find(function(c){return c.id===catId});
  if(cat) cat.cands=cat.cands.filter(function(c){return c.n!==nombre});
}

function showLogin(){
  q("root").innerHTML=
    '<div class="lw"><div class="lc">'+
    '<img src="'+LR+'" style="max-width:220px;width:100%;height:60px;object-fit:contain;display:block;margin:0 auto 16px">'+
    '<div class="lt">Premios AGESPORT 2025</div>'+
    '<div class="lsu">Introduce tus datos para acceder.<br>Cada socio solo puede votar una vez.</div>'+
    '<div class="ler" id="lerr"></div>'+
    '<div class="lf"><label class="lbl">Nombre completo *</label><input class="inp" id="lnom" placeholder="Tu nombre y apellidos"></div>'+
    '<div class="lf"><label class="lbl">Email *</label><input class="inp" id="leml" type="email" placeholder="tucorreo@ejemplo.com"></div>'+
    '<div class="apf" id="apfw"><label class="lbl">Contraseña administrador</label><input class="inp" id="lpas" type="password" placeholder="Contraseña"></div>'+
    '<div class="lav">Tu email se usa solo para evitar votos duplicados.</div>'+
    '<button class="btn bp bf" id="lbtn">Acceder a la votación</button>'+
    '<img src="'+LB+'" style="width:100%;max-width:250px;margin-top:16px;opacity:.6">'+
    '</div></div>';
  q("leml").addEventListener("input",function(){
    q("apfw").style.display=this.value.trim().toLowerCase()===AE?"block":"none";
  });
  q("lbtn").addEventListener("click",doLogin);
  q("lnom").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin()});
  q("leml").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin()});
}

function doLogin(){
  var nom=q("lnom").value.trim();
  var eml=q("leml").value.trim().toLowerCase();
  var err=q("lerr");
  err.style.display="none";
  if(!nom||nom.length<2){err.textContent="Escribe tu nombre completo";err.style.display="block";return}
  if(!eml||eml.indexOf("@")<0){err.textContent="Email no valido";err.style.display="block";return}
  var isAdmEmail=(eml==="agesport@agesport.org"||eml==="granada@agesport.org");
  if(eml===AE||isAdmEmail){
    var pas=q("lpas")?q("lpas").value:"";
    if(pas===AP){U={nom:nom,eml:eml,adm:true,vot:false};sel={};buildApp();return}
    if(pas!==""){err.textContent="Contraseña incorrecta";err.style.display="block";return}
  }
  // Verificar lista de socios autorizados
  if(SOCIOS_AUTH.indexOf(eml)<0){
    err.textContent="Este email no está autorizado para votar. Si crees que es un error, contacta con el delegado provincial: granada@agesport.org";
    err.style.display="block";return;
  }
  var yv=socios.find(function(s){return s.email===eml});
  if(yv){err.textContent="Este email ya voto el "+yv.fecha;err.style.display="block";return}
  U={nom:nom,eml:eml,adm:false,vot:false};sel={};buildApp();
}

    '</div>';
  q("bsal").addEventListener("click",function(){U=null;showLogin()});
  rebuildTabs("vot");
  showVot();
}

function rebuildTabs(active){
  var tabs=q("tabs");
  if(!tabs)return;
  var defs=[
    {v:"vot",label:"Votar"},
    {v:"res",label:"Resultados"},
  ];
  if(U.adm) defs.push({v:"adm",label:"Admin"});
  tabs.innerHTML="";
  defs.forEach(function(d){
    var b=document.createElement("button");
    b.className="tb "+(d.v===active?"on":"off");
    b.textContent=d.label;
    b.setAttribute("data-v",d.v);
    b.addEventListener("click",function(){
      Array.from(tabs.querySelectorAll(".tb")).forEach(function(x){x.className="tb off"});
      b.className="tb on";
      q("main").dataset.v=d.v;
      if(d.v==="vot")showVot();

      else if(d.v==="res")showRes();
      else if(d.v==="adm")showAdm();
    });
    tabs.appendChild(b);
  });
}

function goTab(v){
  rebuildTabs(v);
  q("main").dataset.v=v;
  if(v==="vot")showVot();

  else if(v==="res")showRes();
  else if(v==="adm")showAdm();
}

// ── VOTAR ──

function getCuentaAtras(){
  var hoy=new Date();hoy.setHours(0,0,0,0);
  var fin=new Date(fechaFin+"T00:00:00");fin.setHours(0,0,0,0);
  var diff=Math.ceil((fin-hoy)/(1000*60*60*24));
  return diff;
}
function getEstadoFechas(){
  var hoy=new Date();hoy.setHours(0,0,0,0);
  var ini=new Date(fechaInicio+"T00:00:00");ini.setHours(0,0,0,0);
  var fin=new Date(fechaFin+"T00:00:00");fin.setHours(0,0,0,0);
  if(hoy<ini) return "pendiente";
  if(hoy>fin) return "finalizada";
  return "activa";
}

function showVot(){
  var main=q("main");
  if(estado==="cerrada"){main.innerHTML='<div class="card"><div class="em"><div style="font-size:40px">&#128274;</div><div style="margin-top:8px;font-weight:600">Votacion cerrada</div></div></div>';return}
  var tot=CATS.length,vot=Object.keys(sel).length,pct=tot>0?Math.round(vot/tot*100):0;
  var el=document.createElement("div");

  // Barra progreso
  var prog=document.createElement("div");
  prog.className="card";
  prog.style.cssText="padding:14px 18px;margin-bottom:12px";
  prog.innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">'+
    '<span style="font-weight:600;font-size:13px">Progreso: '+vot+' de '+tot+'</span>'+
    '<span class="ep ea"><span class="dl"></span>Votación abierta</span>'+
    (function(){var d=getCuentaAtras();return d>0?'<span style="background:#E8F5E9;color:#1B5E20;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:600;margin-left:6px">&#9200; '+d+' día'+(d===1?'':'s')+'</span>':'<span style="background:#FFEBEE;color:#C62828;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:600;margin-left:6px">Último día</span>';})()+
    '</div>'+
    '<div style="height:6px;background:#E8F5E9;border-radius:6px;overflow:hidden">'+
    '<div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,#1B5E20,#4CAF50);border-radius:6px;transition:width .4s"></div></div>';
  el.appendChild(prog);

  // Categorias

    var body=document.createElement("div");
    body.className="vcp";

    cat.cands.forEach(function(c){

      vo.className="vo"+(s===c.n?" sel":"");
      vo.style.flexDirection="column";
      vo.style.alignItems="flex-start";

      top.style.cssText="display:flex;align-items:center;gap:10px;width:100%";

      var radio=document.createElement("div");
      radio.className="vr";

      var info=document.createElement("div");
      info.style.flex="1";
      info.innerHTML='<div style="font-weight:500;font-size:13px">'+c.n+
        (c.p?' <span class="badge ba2">Propuesta socio</span>':'')+

      top.appendChild(radio);
      top.appendChild(info);

        motBtn.className="vmot";
        motBtn.textContent="Ver motivos";

          e.stopPropagation();
          var box=q(argId);
          if(!box)return;
          var vis=box.style.display==="block";
          box.style.display=vis?"none":"block";
          motBtn.textContent=vis?"Ver motivos":"Ocultar";
        });
        top.appendChild(motBtn);

      vo.appendChild(top);

        argBox.className="varg";
        argBox.id=argId;
        argBox.textContent=c.a;
        vo.appendChild(argBox);

    // Opcion abstencion
    var voAbs=document.createElement("div");
    voAbs.className="vo"+(s==="__abstencion__"?" sel":"");

  footer.style.flexWrap="wrap";
  footer.style.gap="10px";
  footer.appendChild(txt);

  el.appendChild(footer);

  main.innerHTML="";
  main.appendChild(el);
}

function doEnviar(){
  // Doble comprobacion: evitar voto duplicado aunque sea admin
  var yaVoto=socios.find(function(s){return s.email===U.eml});
  if(yaVoto){alert("Este email ya ha emitido su voto anteriormente.");return}
  var nv=JSON.parse(JSON.stringify(votos));
  var votosEmitidos=0;var abstenciones=0;
  Object.keys(sel).forEach(function(cid){
    if(sel[cid]==="__abstencion__"){abstenciones++;return}
    votosEmitidos++;
    var ck=sk(sel[cid]);
    if(!nv[cid])nv[cid]={};
    nv[cid][ck]=(nv[cid][ck]||0)+1;
  });
  fset("votos",nv).then(function(){
    var f=new Date().toLocaleString("es-ES");
    fpush("socios",{nombre:U.nom,email:U.eml,fecha:f});
    socios.push({nombre:U.nom,email:U.eml,fecha:f});
    U.vot=true;
    rebuildTabs("res");
    q("main").dataset.v="res";
    var main=q("main");
    var absMsg=abstenciones>0?'<div style="color:#9e9e9e;font-size:12px;margin-bottom:6px">('+abstenciones+' categoría'+(abstenciones>1?'s':'')+' sin voto)</div>':'';
    main.innerHTML=
      '<div class="card" style="text-align:center;padding:44px 20px">'+
      '<div style="font-size:54px;margin-bottom:10px">&#127942;</div>'+
      '<div style="font-family:Playfair Display,serif;font-size:22px;font-weight:700;color:#1B5E20;margin-bottom:8px">¡Gracias por tu participación!</div>'+
      '<div style="color:#333;font-size:14px;margin-bottom:4px">Tu voto ha sido registrado correctamente.</div>'+
      '<div style="color:#757575;font-size:13px;margin-bottom:4px">Has votado en <strong>'+votosEmitidos+'</strong> de las '+CATS.length+' categorías.</div>'+
      absMsg+
      '<div style="color:#757575;font-size:12px;margin-bottom:20px;line-height:1.6;max-width:420px;margin-left:auto;margin-right:auto">Tu participación es fundamental para reconocer la excelencia en la gestión deportiva en Andalucía.<br>¡Muchas gracias en nombre de AGESPORT!</div>'+
      '<button class="btn bp" id="bvr">Ver resultados en tiempo real</button></div>';
    q("bvr").addEventListener("click",function(){goTab("res")});
  }).catch(function(e){alert("Error: "+e.message)});
}

    '<div style="background:#FFF8E1;border:1px solid #FFD54F;border-radius:7px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:#E65100" id="pcatlbl"></div>'+

    '</div>'+
    '<div style="margin-bottom:10px"><label class="lbl">Por que merece este premio? (min. 80 caracteres) *</label>'+
    '<textarea class="ta" id="parg" maxlength="600" placeholder="Argumenta los meritos del candidato: logros, impacto social, innovacion, datos..."></textarea>'+
    '<div class="cc" id="pcc">0/600</div></div>'+
    '<div style="margin-bottom:12px;padding:7px 10px;background:#F1F8E9;border-radius:7px;font-size:12px;color:#2E7D32">'+
    'Propuesta en nombre de: <strong>'+U.nom+'</strong></div>'+
    '<div style="display:flex;gap:8px">'+
    '<button class="btn bp" id="pbenv">Enviar propuesta</button>'+
    '<button class="btn bs" id="pblim">Limpiar</button>'+
    '</div></div>';
  el.appendChild(card);

  main.appendChild(el);

    var cid=this.value;

    if(cid){
      var cat=CATS.find(function(c){return c.id===cid});
      lbl.textContent="Categoria "+cat.num+": "+cat.n;
      pf.style.display="block";
      q("pnom").value="";q("pmun").value="";q("parg").value="";q("pcc").textContent="0/600";
    } else {pf.style.display="none"}
  });

    q("pcc").textContent="0/600";q("pcc").style.color="#757575";

      alert("Propuesta enviada. El administrador la revisara antes de publicarla.");
    }).catch(function(e){alert("Error: "+e.message)});
  });

function showRes(){
  var tv=0;
  Object.keys(votos).forEach(function(cid){var cv=votos[cid]||{};Object.keys(cv).forEach(function(k){if(k!=="__abstencion__")tv+=(cv[k]||0)})});
  var el=document.createElement("div");

  var hcard=document.createElement("div");
  hcard.className="card";
  hcard.innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px">'+
    '<div><div class="ct">Resultados en tiempo real</div><div class="cs" style="margin-bottom:0">Actualizacion automatica</div></div>'+
    '<span class="ep '+(estado==="abierta"?"ea":"ec")+'">'+(estado==="abierta"?'<span class="dl"></span>En curso':"&#128274; Cerrada")+'</span></div>'+
    '<div class="g2">'+
    '<div class="sb"><div class="sn">'+CATS.length+'</div><div class="sl">Categorias</div></div>'+
    '<div class="sb"><div class="sn">'+tv+'</div><div class="sl">Votos totales</div></div></div>';
  el.appendChild(hcard);

  CATS.forEach(function(cat){
    var cv=votos[cat.id]||{};
    var tot=0;Object.keys(cv).forEach(function(k){if(k!=="__abstencion__")tot+=(cv[k]||0)});
    var sorted=cat.cands.slice().sort(function(a,b){return(cv[sk(b.n)]||0)-(cv[sk(a.n)]||0)});
    var maxv=sorted.length>0?(cv[sk(sorted[0].n)]||0):0;

    var rcard=document.createElement("div");
    rcard.style.cssText="border:2px solid #E8F5E9;border-radius:12px;overflow:hidden;margin-bottom:14px";

    var rhdr=document.createElement("div");
    rhdr.style.cssText="background:#1B5E20;padding:10px 16px;display:flex;justify-content:space-between;align-items:center";
    rhdr.innerHTML=
      '<div style="display:flex;align-items:center;gap:7px">'+
      '<span style="background:rgba(255,255,255,.2);border-radius:5px;padding:2px 7px;font-size:11px;color:white;font-weight:700">'+cat.num+'</span>'+
      '<span style="color:white;font-weight:600;font-size:12px">'+cat.n+'</span></div>'+
      '<span style="color:#C8E6C9;font-size:11px">'+tot+' voto'+(tot!==1?"s":"")+'</span>';

    var rbody=document.createElement("div");
    rbody.style.cssText="padding:12px 16px";

    sorted.forEach(function(c,i){
      var v=cv[sk(c.n)]||0;
      var pct=maxv>0?Math.round(v/maxv*100):0;
      var win=i===0&&v>0;
      var rr=document.createElement("div");
      rr.className="rrow";
      rr.innerHTML=
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'+
        '<div style="display:flex;align-items:center;gap:6px">'+
        (win?'<span style="font-size:15px">&#127942;</span>':'')+
        '<div style="font-weight:'+(win?700:400)+';font-size:12px;color:'+(win?"#1B5E20":"#1A1A1A")+'">'+c.n+'</div></div>'+
        '<div style="font-weight:700;font-size:12px;color:#1B5E20">'+v+' voto'+(v!==1?"s":"")+(tot>0?" &middot; "+Math.round(v/tot*100)+"%":"")+'</div></div>'+
        '<div class="bb"><div class="br" style="width:'+pct+'%;background:'+(win?"linear-gradient(90deg,#1B5E20,#4CAF50)":"#C8E6C9")+'"></div></div>';
      rbody.appendChild(rr);
    });

    rcard.appendChild(rhdr);
    rcard.appendChild(rbody);
    el.appendChild(rcard);
  });

  q("main").innerHTML="";
  q("main").appendChild(el);
  setTimeout(function(){if(q("main")&&q("main").dataset.v==="res")showRes()},5000);
}

        '<td style="padding:7px 10px;color:#757575">'+(i+1)+'</td>'+
        '<td style="padding:7px 10px;font-weight:600">'+s.nombre+'</td>'+
        '<td style="padding:7px 10px;color:#757575">'+s.email+'</td>'+
        '<td style="padding:7px 10px;color:#757575">'+s.fecha+'</td>'+
        '<td style="padding:7px 10px;text-align:center"><button class="btn bd bsm" data-dem="'+s.email+'">X</button></td></tr>';
    });
    thtml+='</tbody></table>';
    tbl.innerHTML=thtml;
    scard2.appendChild(tbl);
    el.appendChild(scard2);
  }

  main.innerHTML="";
  main.appendChild(el);

  // Events del panel
  q("btgest").addEventListener("click",function(){
    estado=estado==="abierta"?"cerrada":"abierta";
    fset("estado",estado).then(showAdm);
  });
  q("btrv").addEventListener("click",function(){
    if(!confirm("Reiniciar todos los votos?"))return;
    fset("votos",{}).then(function(){votos={};showAdm()});
  });
  q("btrs").addEventListener("click",function(){
    if(!confirm("Reiniciar lista de socios?"))return;
    fset("socios",{}).then(function(){socios=[];showAdm()});
  });
  q("btfechas").addEventListener("click",function(){
    var ini=q("fadmin_ini").value;
    var fin=q("fadmin_fin").value;
    if(!ini||!fin){alert("Introduce ambas fechas");return}
    if(ini>fin){alert("La fecha de inicio no puede ser posterior a la de fin");return}
    fset("fechas",{inicio:ini,fin:fin}).then(function(){
      fechaInicio=ini;fechaFin=fin;
      var msg=q("fechasmsg");
      msg.textContent="Fechas guardadas correctamente";
      setTimeout(function(){msg.textContent="";showAdm();},2000);
    });
  });

  // Propuestas: aprobar/rechazar
  el.addEventListener("click",function(e){
    var aprBtn=e.target.closest("[data-act='apr']");
    var recBtn=e.target.closest("[data-act='rec']");
    var delEm=e.target.closest("[data-dem]");
    var delCand=e.target.closest("[data-dcand]");

    if(aprBtn){
      var pid=aprBtn.dataset.pid;
      fget("propuestas",function(raw){
        if(!raw)return;
        var key=Object.keys(raw).find(function(k){return raw[k].id===pid});
        if(!key)return;
        db.ref("propuestas/"+key+"/aprobada").set(true).then(function(){
          var p=props.find(function(x){return x.id===pid});
          if(p){p.aprobada=true;addPropToCat(p)}
          showAdm();
        });
      });
    }
    if(recBtn){
      var pid2=recBtn.dataset.pid;
      fget("propuestas",function(raw){
        if(!raw)return;
        var key=Object.keys(raw).find(function(k){return raw[k].id===pid2});
        if(!key)return;
        db.ref("propuestas/"+key).remove().then(function(){
          var p=props.find(function(x){return x.id===pid2});
          if(p&&p.aprobada)remPropFromCat(p.nombre,p.catId);
          props=props.filter(function(x){return x.id!==pid2});
          showAdm();
        });
      });
    }
    if(delEm){
      var em=delEm.dataset.dem;
      fget("socios",function(raw){
        if(!raw)return;
        var key=Object.keys(raw).find(function(k){return raw[k].email===em});
        if(key)db.ref("socios/"+key).remove().then(function(){
          socios=socios.filter(function(s){return s.email!==em});
          showAdm();
        });
      });
    }
    if(delCand){
      var cn=delCand.dataset.dcand,cid=delCand.dataset.dcat;
      if(!confirm("Eliminar a "+cn+" de esta categoría?"))return;
      remPropFromCat(cn,cid);
      // Si es propuesta, eliminar de Firebase
      fget("propuestas",function(raw){
        if(!raw)return;
        var key=Object.keys(raw).find(function(k){return raw[k].nombre===cn&&raw[k].catId===cid});
        if(key)db.ref("propuestas/"+key).remove().then(function(){
          props=props.filter(function(p){return!(p.nombre===cn&&p.catId===cid)});
        });
      });
      // Refrescar lista
      var sel2=q("gcatsel");if(sel2)sel2.dispatchEvent(new Event("change"));
    }
  });

  // Gestión candidaturas: selector categoria
  q("gcatsel").addEventListener("change",function(){
    var cid=this.value;
    var gcands=q("gcands"),gbopen=q("gbopen"),gaddform=q("gaddform");
    if(!cid){gcands.innerHTML="";gbopen.style.display="none";gaddform.style.display="none";return}
    var cat=CATS.find(function(c){return c.id===cid});
    if(!cat)return;
    gcands.innerHTML="";
    if(cat.cands.length===0){
      gcands.innerHTML='<div style="font-size:12px;color:#757575;font-style:italic;padding:4px 0">Sin candidatos en esta categoría</div>';
    } else {
      cat.cands.forEach(function(c){
        var ci=document.createElement("div");
        ci.className="citem";
        ci.innerHTML=
          '<div><div style="font-weight:600;font-size:12px">'+c.n+(c.p?' <span class="badge ba2">Socio</span>':'')+'</div>'+
          '<div style="font-size:11px;color:#757575">'+c.m+'</div></div>'+
          '<button class="btn bd bsm" data-dcand="'+c.n+'" data-dcat="'+cid+'">Eliminar</button>';
        gcands.appendChild(ci);
      });
    }
    gbopen.style.display="inline-flex";
    gaddform.style.display="none";
    if(q("gnom"))q("gnom").value="";
    if(q("gmun"))q("gmun").value="";
    if(q("garg"))q("garg").value="";
  });

  q("gbopen").addEventListener("click",function(){
    q("gaddform").style.display="block";
    this.style.display="none";
  });
  q("gbcan").addEventListener("click",function(){
    q("gaddform").style.display="none";
    q("gbopen").style.display="inline-flex";
    q("gnom").value="";q("gmun").value="";q("garg").value="";
  });
  // ── Sección gestión emails autorizados ──
  var ecard=document.createElement("div");
  ecard.className="card";
  ecard.innerHTML='<div class="ct" style="font-size:16px">Socios autorizados a votar</div>'+
    '<div class="cs">Gestiona los emails que pueden acceder a la votación. Total: <strong id="etotal">'+SOCIOS_AUTH.length+'</strong></div>'+
    '<div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap">'+
    '<input class="inp" id="enuevo" placeholder="nuevo@email.com" style="flex:1;min-width:200px">'+
    '<button class="btn bp bsm" id="beadd">+ Aniadir</button>'+
    '</div>'+
    '<div style="margin-bottom:14px">'+
    '<div style="font-size:12px;color:#555;margin-bottom:4px">Pegar lista de emails (uno por linea o separados por coma/punto y coma):</div>'+
    '<textarea id="ebulk" class="inp" placeholder="email1@ejemplo.com&#10;email2@ejemplo.com&#10;email3@ejemplo.com" style="width:100%;min-height:80px;font-size:12px;resize:vertical;box-sizing:border-box"></textarea>'+
    '<div style="display:flex;gap:8px;margin-top:5px">'+
    '<button class="btn bp bsm" id="beaddmulti">+ Añadir lista</button>'+
    '<span id="ebulkmsg" style="font-size:12px;color:#2e7d32;line-height:28px"></span>'+
    '</div>'+
    '</div>'+
    '<div id="emailist" style="max-height:300px;overflow-y:auto"></div>';
  el.appendChild(ecard);

  function renderEmailList(){
    var el2=q("emailist");
    if(!el2)return;
    el2.innerHTML="";
    SOCIOS_AUTH.forEach(function(em,i){
      var row=document.createElement("div");
      row.className="citem";
      row.style.marginBottom="4px";
      row.innerHTML=
        '<span style="font-size:12px;color:#333">'+em+'</span>'+
        '<div style="display:flex;gap:5px">'+
        '<button class="btn bs bsm" data-eedit="'+i+'">Editar</button>'+
        '<button class="btn bd bsm" data-edel="'+i+'">X</button>'+
        '</div>';
      el2.appendChild(row);
    });
    if(q("etotal"))q("etotal").textContent=SOCIOS_AUTH.length;
  }
  renderEmailList();

  function saveEmails(){
    fset("emails_auth",SOCIOS_AUTH).then(function(){
      renderEmailList();
    });
  }

  q("beadd").addEventListener("click",function(){
    var em=q("enuevo").value.trim().toLowerCase();
    if(!em||em.indexOf("@")<0){alert("Email no valido");return}
    if(SOCIOS_AUTH.indexOf(em)>=0){alert("Este email ya esta en la lista");return}
    SOCIOS_AUTH.push(em);
    q("enuevo").value="";
    saveEmails();
  });

  q("beaddmulti").addEventListener("click",function(){
    var raw=q("ebulk").value;
    var parts=raw.split(/[\n,;]+/);
    var added=0;var skipped=0;
    parts.forEach(function(p){
      var em=p.trim().toLowerCase();
      if(!em)return;
      if(em.indexOf("@")<0){skipped++;return}
      if(SOCIOS_AUTH.indexOf(em)>=0){skipped++;return}
      SOCIOS_AUTH.push(em);added++;
    });
    q("ebulk").value="";
    var msg=q("ebulkmsg");
    msg.textContent="Anadidos: "+added+(skipped?" ("+skipped+" omitidos)":"");
    setTimeout(function(){msg.textContent="";},4000);
    if(added>0)saveEmails();
  });

  ecard.addEventListener("click",function(e){
    var edel=e.target.closest("[data-edel]");
    var eedit=e.target.closest("[data-eedit]");
    if(edel){
      var idx=parseInt(edel.dataset.edel);
      var em=SOCIOS_AUTH[idx];
      if(!confirm("Eliminar "+em+" de la lista?"))return;
      SOCIOS_AUTH.splice(idx,1);
      saveEmails();
    }
    if(eedit){
      var idx2=parseInt(eedit.dataset.eedit);
      var emActual=SOCIOS_AUTH[idx2];
      var nuevo=prompt("Editar email:",emActual);
      if(!nuevo||nuevo.trim()===emActual)return;
      nuevo=nuevo.trim().toLowerCase();
      if(nuevo.indexOf("@")<0){alert("Email no valido");return}
      if(SOCIOS_AUTH.indexOf(nuevo)>=0){alert("Este email ya existe");return}
      SOCIOS_AUTH[idx2]=nuevo;
      saveEmails();
    }
  });

  q("gbenv").addEventListener("click",function(){
    var cid=q("gcatsel").value;
    var nom=q("gnom").value.trim();
    var mun=q("gmun").value.trim();
    var arg=q("garg").value.trim();
    if(!cid){alert("Selecciona una categoría");return}
    if(!nom||nom.length<2){alert("Escribe el nombre del candidato");return}
    var cat=CATS.find(function(c){return c.id===cid});
    if(!cat)return;
    var ex=cat.cands.find(function(c){return c.n===nom});
    if(ex){alert("Este candidato ya existe en la categoría");return}
    cat.cands.push({n:nom,m:mun||"s/d",a:arg,p:false});
    var nv={id:"adm"+Date.now(),catId:cid,nombre:nom,municipio:mun||"s/d",argumento:arg,socio:"Administrador",fecha:new Date().toLocaleString("es-ES"),aprobada:true};
    fpush("propuestas",nv).then(function(){
      props.push(nv);
      q("gcatsel").dispatchEvent(new Event("change"));
      q("gnom").value="";q("gmun").value="";q("garg").value="";
      q("gaddform").style.display="none";
      q("gbopen").style.display="inline-flex";
    });
  });
}

init();
</script>
</body>
</html>
