      { nombre:"Teresa Moya Garciolo", municipio:"Almuñécar", argumento:"Perdió la vista a los 16 años y se convirtió en la única gimnasta ciega que compite en España, logrando campeonatos y subcampeonatos nacionales. Reconocida con el Premio a la Superación en la Gala del Deporte de Almuñécar 2025. El deporte como herramienta de vida y superación de límites, con impacto transformador sobre el deporte adaptado en la provincia." },

  ];

  // ── ESTADO GLOBAL ─────────────────────────────────────────────────────────
  let socioActual = null;
  let estado = "abierta";
  let votos  = {};
  let socios = [];
  let propuestas = [];
  let categorias = DEFAULT_CATS;

  // ── FIREBASE HELPERS ──────────────────────────────────────────────────────
  async function fbGet(path) {
    const snap = await db.ref(path).once("value");
    return snap.exists() ? snap.val() : null;
  }
  async function fbSet(path, val) {
    await db.ref(path).set(val);
  }

  // ── INIT ──────────────────────────────────────────────────────────────────
  async function init() {
    const [est, vts, socs, props, cats] = await Promise.all([
      fbGet("estado"), fbGet("votos"), fbGet("socios"),
      fbGet("propuestas"), fbGet("categorias")
    ]);
    estado     = est  || "abierta";
    votos      = vts  || {};

    socios     = socs ? Object.values(socs) : [];
    propuestas = props? Object.values(props): [];
    categorias = cats ? mergeCats(Object.values(cats)) : DEFAULT_CATS;
    renderApp();
    suscribirResultados();
  }

  function mergeCats(catsDB) {
    return catsDB.map(cat => {
      const def = DEFAULT_CATS.find(d => d.id === cat.id);
      return {
        ...cat,
        candidatos: (cat.candidatos || []).map(c => {
          const dc = def?.candidatos.find(x => x.nombre === c.nombre);
          return dc ? { ...c, argumento: dc.argumento } : c;
        })
      };
    });
  }

  function suscribirResultados() {
    db.ref("votos").on("value",  snap => { votos = snap.val() || {}; renderResultados(); });
    db.ref("socios").on("value", snap => { socios = snap.val() ? Object.values(snap.val()) : []; });
    db.ref("estado").on("value", snap => { estado = snap.val() || "abierta"; });
  }

  // ── RENDER PRINCIPAL ──────────────────────────────────────────────────────
  function renderApp() {
    document.getElementById("root").innerHTML = socioActual
      ? renderLayout() : renderLogin();
    bindEvents();
  }

  function renderLogin() {
    return `

      <div class="login-card">

          <input class="input" id="inp-email" type="email" placeholder="tucorreo@ejemplo.com" oninput="checkAdminField()">
        </div>
        <div class="admin-field" id="admin-field-wrap">

          <input class="input" id="inp-admin-pass" type="password" placeholder="Contraseña de admin">

          <img src="${LOGO_ROUND}" style="width:42px;height:42px;border-radius:50%;object-fit:cover">

            <div style="color:rgba(255,255,255,0.6);font-size:11px">${socioActual.email}</div>

  // ── VOTAR ─────────────────────────────────────────────────────────────────
  let seleccion = {};
  function renderVotar() {
    if (estado === "cerrada") return `<div class="card"><div class="empty"><div class="empty-icon">🔒</div><div class="empty-title">Votación cerrada</div><div class="empty-sub">Consulta los resultados en la pestaña Resultados.</div></div></div>`;
    const total = categorias.length;
    const votadas = Object.keys(seleccion).length;
    const pct = total > 0 ? Math.round(votadas/total*100) : 0;
    return `
      <div class="card" style="padding:20px 28px;margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <span style="font-weight:600;font-size:15px">Progreso: ${votadas} de ${total} categorías</span>
          <span class="estado-pill estado-abierta"><span class="dot-live"></span>Votación abierta</span>
        </div>
        <div style="height:8px;background:#F5F5F5;border-radius:8px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#1B5E20,#4CAF50);border-radius:8px;transition:width 0.4s"></div>
        </div>
      </div>
      ${categorias.map(cat => renderCatVotar(cat)).join("")}
      <div class="card" style="padding:20px 28px">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
          <span style="color:#757575;font-size:13px">${votadas===0?"Selecciona al menos una candidatura":votadas<total?`Faltan ${total-votadas} categorías`:"¡Todas las categorías votadas!"}</span>
          <button class="btn btn-primary" id="btn-enviar-voto" ${votadas===0?"disabled":""}>🗳️ Enviar votos (${votadas})</button>
        </div>
      </div>`;
  }

  function renderCatVotar(cat) {
    const sel = seleccion[cat.id];
    return `
    <div class="vote-cat ${sel?"voted":""}" style="margin-bottom:16px">
      <div class="vote-cat-header">
        <div class="cat-num">${cat.id}</div>
        <div style="flex:1">
          <div style="font-weight:700;font-size:15px;color:#1B5E20">${cat.nombre}</div>
          <div style="font-size:12px;color:#757575">${cat.candidatos.length} candidaturas</div>
        </div>
        ${sel?'<span class="badge badge-green">✓ Votado</span>':""}
      </div>
      <div style="padding:16px 20px">
        ${cat.candidatos.map(c => renderOpcion(cat.id, c, sel===c.nombre)).join("")}
      </div>
    </div>`;
  }

  function renderOpcion(catId, c, selected) {
    const id = `opt-${catId}-${c.nombre.replace(/[^a-z0-9]/gi,"_")}`;
    return `
    <div class="vote-option ${selected?"selected":""}" data-cat="${catId}" data-cand="${c.nombre}" style="flex-direction:column;align-items:flex-start;cursor:pointer">
      <div style="display:flex;align-items:center;gap:14px;width:100%">
        <div class="vote-radio" style="flex-shrink:0">${selected?'<div class="vote-radio-dot"></div>':""}</div>
        <div style="flex:1">
          <div class="vote-option-name">${c.nombre}${c.esPropuesta?'<span class="badge badge-amber" style="margin-left:8px;font-size:10px">✍️ Socio</span>':""}</div>
          <div class="vote-option-mun">📍 ${c.municipio}</div>
        </div>
        ${c.argumento?`<button class="arg-toggle" data-arg-id="${id}">▼ Ver motivos</button>`:""}
      </div>
      ${c.argumento?`<div class="arg-box" id="arg-${id}" style="display:none">${c.argumento}</div>`:""}
    </div>`;
  }

  // ── RESULTADOS ────────────────────────────────────────────────────────────
  function renderResultados() {
    const main = document.getElementById("main-content");
    if (!main || !main.dataset.tab || main.dataset.tab !== "resultados") return;
    main.innerHTML = renderResultadosHTML();
  }

  function renderResultadosHTML() {
    const totalVotos = Object.values(votos).reduce((s,cv)=>s+Object.values(cv).reduce((a,b)=>a+b,0),0);
    return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px">
        <div><div class="card-title">Resultados en tiempo real</div><div class="card-sub">Actualización automática</div></div>
        <span class="estado-pill ${estado==="abierta"?"estado-abierta":"estado-cerrada"}">${estado==="abierta"?'<span class="dot-live"></span>En curso':"🔒 Cerrada"}</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="stat-box"><div class="stat-num">${categorias.length}</div><div class="stat-label">Categorías</div></div>
        <div class="stat-box"><div class="stat-num">${totalVotos}</div><div class="stat-label">Votos totales</div></div>
      </div>
    </div>
    ${categorias.map(cat => {
      const cv = votos[cat.id]||{};
      const total = Object.values(cv).reduce((a,b)=>a+b,0);
      const sanitize = s => s.replace(/[.#$\[\]]/g, '_');
      const sorted = [...cat.candidatos].sort((a,b)=>(cv[sanitize(b.nombre)]||0)-(cv[sanitize(a.nombre)]||0));
      const maxV = sorted.length>0?(cv[sanitize(sorted[0].nombre)]||0):0;
      return `
      <div style="border:2px solid #E8F5E9;border-radius:14px;overflow:hidden;margin-bottom:16px">
        <div style="background:#1B5E20;padding:12px 20px;display:flex;justify-content:space-between;align-items:center">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="background:rgba(255,255,255,0.2);border-radius:6px;padding:2px 8px;font-size:12px;color:white;font-weight:700">${cat.id}</span>
            <span style="color:white;font-weight:600;font-size:14px">${cat.nombre}</span>
          </div>
          <span style="color:#C8E6C9;font-size:12px">${total} votos</span>
        </div>
        <div style="padding:16px 20px">
          ${sorted.map((c,i) => {
            const v = cv[sanitize(c.nombre)]||0;
            const pct = maxV>0?Math.round(v/maxV*100):0;
            const win = i===0&&v>0;
            return `
            <div style="margin-bottom:14px">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                <div style="display:flex;align-items:center;gap:8px">
                  ${win?'<span style="font-size:18px">🏆</span>':""}
                  <div>
                    <div style="font-weight:${win?700:500};font-size:13px;color:${win?"#1B5E20":"#1A1A1A"}">${c.nombre}</div>
                    <div style="font-size:11px;color:#757575">📍 ${c.municipio}</div>
                  </div>
                </div>
                <div style="font-weight:700;font-size:13px;color:#1B5E20">${v} votos${total>0?` · ${Math.round(v/total*100)}%`:""}</div>
              </div>
              <div style="height:10px;background:#F5F5F5;border-radius:10px;overflow:hidden">
                <div style="height:100%;width:${pct}%;background:${win?"linear-gradient(90deg,#1B5E20,#4CAF50)":"#C8E6C9"};border-radius:10px;transition:width 0.6s"></div>
              </div>
            </div>`;
          }).join("")}
        </div>
      </div>`;
    }).join("")}`;
  }

            <th style="padding:10px 14px;text-align:left;color:#1B5E20;border-bottom:2px solid #C8E6C9">Email</th>
            <th style="padding:10px 14px;text-align:left;color:#1B5E20;border-bottom:2px solid #C8E6C9">Fecha</th>
            <th style="padding:10px 14px;text-align:center;color:#1B5E20;border-bottom:2px solid #C8E6C9">Acción</th>
          </tr></thead>
          <tbody>
            ${socios.map((s,i)=>`
            <tr style="border-bottom:1px solid #E8F5E9;background:${i%2===0?"white":"#F9FBE7"}">
              <td style="padding:10px 14px;color:#757575">${i+1}</td>
              <td style="padding:10px 14px;font-weight:600">${s.nombre}</td>
              <td style="padding:10px 14px;color:#757575">${s.email}</td>
              <td style="padding:10px 14px;color:#757575">${s.fecha}</td>
              <td style="padding:10px 14px;text-align:center"><button class="btn btn-danger btn-sm" data-del-socio="${s.email}">✕</button></td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>`}
    </div>`;
  }

  // ── BIND EVENTS ───────────────────────────────────────────────────────────
  function bindEvents() {
    // Login
    // Mostrar campo contraseña si el email es el de admin
    window.checkAdminField = function() {
      const email = document.getElementById("inp-email").value.trim().toLowerCase();
      const wrap  = document.getElementById("admin-field-wrap");
      if (wrap) wrap.style.display = email === ADMIN_EMAIL ? "block" : "none";
    };

    const btnEntrar = document.getElementById("btn-entrar");
    if (btnEntrar) {
      btnEntrar.onclick = async () => {
        const nombre = document.getElementById("inp-nombre").value.trim();
        const email  = document.getElementById("inp-email").value.trim().toLowerCase();
        const errDiv = document.getElementById("login-error");
        if (!nombre || nombre.length < 2) { errDiv.textContent="Escribe tu nombre completo"; errDiv.style.display="block"; return; }
        if (!/^[^\s@]+@[^\s@]+$/.test(email)) { errDiv.textContent="Email no válido"; errDiv.style.display="block"; return; }

        // Acceso administrador (email admin + contraseña correcta)
        if (email === ADMIN_EMAIL) {
          const pass = document.getElementById("inp-admin-pass")?.value || "";
          if (pass === ADMIN_PASS) {
            // Entra como admin sin restricción de voto
            socioActual = { nombre, email, esAdmin: true };
            seleccion = {};
            renderApp();
            return;
          } else if (pass !== "" ) {
            // Escribió contraseña pero es incorrecta
            errDiv.textContent="Contraseña de administrador incorrecta"; 
            errDiv.style.display="block"; 
            return;
          }
          // Si no escribió contraseña → entra como socio normal
        }

        // Socio normal (incluido admin sin contraseña)
        const yaVoto = socios.find(s=>s.email===email);
        if (yaVoto) { errDiv.textContent=`Este email ya fue utilizado para votar el ${yaVoto.fecha}. Cada socio solo puede votar una vez.`; errDiv.style.display="block"; return; }
        socioActual = { nombre, email, esAdmin: false };
        seleccion = {};
        renderApp();
      };
    }

    // Salir
    const btnSalir = document.getElementById("btn-salir");
    if (btnSalir) btnSalir.onclick = () => { socioActual=null; renderApp(); };

    // Tabs
    document.querySelectorAll("[data-tab]").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll("[data-tab]").forEach(b=>{ b.classList.remove("active"); b.classList.add("inactive"); });
        btn.classList.add("active"); btn.classList.remove("inactive");
        const main = document.getElementById("main-content");
        main.dataset.tab = btn.dataset.tab;
        if      (btn.dataset.tab==="votar")      main.innerHTML = renderVotar();
        else if (btn.dataset.tab==="proponer")   { main.innerHTML = renderProponer(); bindEvents(); return; }
        else if (btn.dataset.tab==="resultados") { main.innerHTML = renderResultadosHTML(); bindEvents(); return; }
        else if (btn.dataset.tab==="admin")      { main.innerHTML = renderAdmin(); bindEvents(); return; }
        bindEvents();
      };
    });

    // Seleccionar candidato
    document.querySelectorAll(".vote-option").forEach(el => {
      el.onclick = (e) => {
        if (e.target.classList.contains("arg-toggle")) return;
        if (e.target.closest(".arg-box")) return;
        const catId = el.dataset.cat;
        const cand  = el.dataset.cand;
        if (catId && cand) {
          seleccion[catId] = cand;
          document.getElementById("main-content").innerHTML = renderVotar();
          bindEvents();
        }
      };
    });

    // Ver motivos
    document.querySelectorAll(".arg-toggle").forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const id  = btn.dataset.argId;
        const box = document.getElementById("arg-"+id);
        if (box) {
          const visible = box.style.display !== "none";
          box.style.display = visible ? "none" : "block";
          btn.textContent  = visible ? "▼ Ver motivos" : "▲ Ocultar";
        }
      };
    });

    // Enviar voto
    const btnVoto = document.getElementById("btn-enviar-voto");
    if (btnVoto) btnVoto.onclick = async () => {
      const newVotos = JSON.parse(JSON.stringify(votos));
      Object.entries(seleccion).forEach(([catId,cand]) => {
        if (!newVotos[catId]) newVotos[catId]={};
        const candKey = cand.replace(/[.#$\[\]]/g, '_');
        newVotos[catId][candKey] = (newVotos[catId][candKey]||0)+1;
      });
      await fbSet("votos", newVotos);
      const fecha = new Date().toLocaleString("es-ES");
      await db.ref("socios").push({ nombre:socioActual.nombre, email:socioActual.email, fecha });
      votos = newVotos;
      socios.push({ nombre:socioActual.nombre, email:socioActual.email, fecha });
      socioActual.haVotado = true;
      document.getElementById("main-content").innerHTML = `
        <div class="card" style="text-align:center;padding:64px 32px">
          <div style="font-size:64px;margin-bottom:16px">🏆</div>
          <div class="card-title" style="text-align:center;font-size:26px;margin-bottom:8px">¡Gracias por tu voto!</div>
          <div style="color:#757575;font-size:14px;margin-bottom:24px">Tu voto ha sido registrado en ${Object.keys(seleccion).length} categorías.</div>
          <button class="btn btn-primary" onclick="document.querySelector('[data-tab=resultados]').click()">📊 Ver resultados en tiempo real</button>
        </div>`;
      // Redibujar header para mostrar pestaña Resultados
      document.querySelector('.tab-bar-outer').innerHTML = `
        <button class="tab-btn inactive" data-tab="votar">🗳️ Votar</button>
        <button class="tab-btn inactive" data-tab="proponer">✍️ Proponer</button>
        <button class="tab-btn active" data-tab="resultados">📊 Resultados</button>
        ${socioActual.esAdmin ? '<button class="tab-btn inactive" data-tab="admin">⚙️ Admin</button>' : ''}
      `;
      bindEvents();
    };

    // Proponer toggle
    document.querySelectorAll(".prop-toggle").forEach(btn => {
      btn.onclick = () => {
        const catId = btn.dataset.cat;
        const form = document.getElementById("propform-"+catId);
        form.style.display = form.style.display==="none"?"block":"none";
        btn.textContent = form.style.display==="none"?"+ Proponer":"Cancelar";
      };
    });

    // Char count propuesta
    document.querySelectorAll(".prop-arg").forEach(ta => {
      ta.oninput = () => {
        const charEl = document.querySelector(`.prop-char[data-cat="${ta.dataset.cat}"]`);
        if (charEl) { charEl.textContent = ta.value.length+"/600"; charEl.style.color=ta.value.length<80?"#E65100":"#757575"; }
      };
    });

    // Enviar propuesta
    document.querySelectorAll(".prop-enviar").forEach(btn => {
      btn.onclick = async () => {
        const catId = btn.dataset.cat;
        const nombre  = document.querySelector(`.prop-nombre[data-cat="${catId}"]`).value.trim();
        const mun     = document.querySelector(`.prop-mun[data-cat="${catId}"]`).value.trim();
        const argText = document.querySelector(`.prop-arg[data-cat="${catId}"]`).value.trim();
        if (!nombre||argText.length<80) { alert("El nombre y el argumento (mín. 80 caracteres) son obligatorios."); return; }
        const nueva = { id:"prop_"+Date.now(), catId, nombre, municipio:mun||"—", argumento:argText, socio:socioActual.nombre, fecha:new Date().toLocaleString("es-ES"), aprobada:false };
        await db.ref("propuestas").push(nueva);
        propuestas.push(nueva);
        alert("✓ Propuesta enviada. El administrador la revisará antes de publicarla.");
        document.getElementById("propform-"+catId).style.display="none";
      };
    });

    // Admin: toggle estado
    const btnEstado = document.getElementById("btn-toggle-estado");
    if (btnEstado) btnEstado.onclick = async () => {
      const nuevo = estado==="abierta"?"cerrada":"abierta";
      await fbSet("estado", nuevo);
      estado = nuevo;
      document.getElementById("main-content").innerHTML = renderAdmin();
      bindEvents();
    };

    // Admin: reiniciar votos
    const btnResetV = document.getElementById("btn-reset-votos");
    if (btnResetV) btnResetV.onclick = async () => {
      if (!confirm("¿Seguro que quieres reiniciar todos los votos?")) return;
      await fbSet("votos", {});
      votos = {};
      document.getElementById("main-content").innerHTML = renderAdmin();
      bindEvents();
    };

    // Admin: reiniciar socios
    const btnResetS = document.getElementById("btn-reset-socios");
    if (btnResetS) btnResetS.onclick = async () => {
      if (!confirm("¿Seguro que quieres reiniciar la lista de socios votantes?")) return;
      await fbSet("socios", {});
      socios = [];
      document.getElementById("main-content").innerHTML = renderAdmin();
      bindEvents();
    };

    // Admin: aprobar/rechazar propuestas
    document.querySelectorAll("[data-aprobar]").forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.aprobar;
        propuestas = propuestas.map(p=>p.id===id?{...p,aprobada:true}:p);
        await fbSet("propuestas", propuestas.reduce((o,p)=>{o[p.id]=p;return o},{}));
        document.getElementById("main-content").innerHTML = renderAdmin();
        bindEvents();
      };
    });
    document.querySelectorAll("[data-rechazar]").forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.rechazar;
        propuestas = propuestas.filter(p=>p.id!==id);
        await fbSet("propuestas", propuestas.reduce((o,p)=>{o[p.id]=p;return o},{}));
        document.getElementById("main-content").innerHTML = renderAdmin();
        bindEvents();
      };
    });

    // Admin: eliminar socio
    document.querySelectorAll("[data-del-socio]").forEach(btn => {
      btn.onclick = async () => {
        const email = btn.dataset.delSocio;
        socios = socios.filter(s=>s.email!==email);
        await fbSet("socios", socios.reduce((o,s,i)=>{o["s"+i]=s;return o},{}));
        document.getElementById("main-content").innerHTML = renderAdmin();
        bindEvents();
      };
    });
  }

  init();
  } // fin arrancar()
</script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

.tab-btn.inactive:hover{background:rgba(255,255,255,.25);color:white}

.card-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:#1B5E20;margin-bottom:6px}
.card-sub{font-size:13px;color:#757575;margin-bottom:24px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s}
.btn-primary{background:#1B5E20;color:white}.btn-primary:hover{background:#2E7D32;transform:translateY(-1px)}
.btn-secondary{background:#F5F5F5;color:#1A1A1A}.btn-secondary:hover{background:#E0E0E0}

.btn-amber{background:#FFF8E1;color:#E65100}.btn-amber:hover{background:#FFECB3}
.btn-full{width:100%;justify-content:center;padding:14px;font-size:16px}
.btn-sm{padding:6px 14px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.input,.textarea{width:100%;padding:10px 14px;border:2px solid #E8F5E9;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:14px;color:#1A1A1A;transition:border-color .2s;outline:none;background:#F5F5F5}
.input:focus,.textarea:focus{border-color:#4CAF50;background:white}
.textarea{resize:vertical;min-height:90px;line-height:1.6}
.label{font-size:12px;font-weight:600;color:#757575;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:block}
.label-req::after{content:" *";color:#E65100}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-green{background:#C8E6C9;color:#1B5E20}
.badge-amber{background:#FFF3E0;color:#BF360C}
.stat-box{background:#F1F8E9;border-radius:12px;padding:18px 20px;text-align:center}
.stat-num{font-family:'Playfair Display',serif;font-size:36px;font-weight:900;color:#1B5E20;line-height:1}
.stat-label{font-size:12px;color:#757575;font-weight:500;margin-top:4px}
.cat-num{width:32px;height:32px;border-radius:50%;background:#F1F8E9;color:#1B5E20;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.vote-cat{border:2px solid #E8F5E9;border-radius:14px;overflow:hidden}
.vote-cat.voted{border-color:#4CAF50}
.vote-cat-header{background:#F1F8E9;padding:14px 20px;display:flex;align-items:center;gap:12px}
.vote-option{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:10px;border:2px solid transparent;margin-bottom:8px;transition:all .18s;background:#F5F5F5}
.vote-option:hover{border-color:#C8E6C9;background:#F1F8E9}
.vote-option.selected{border-color:#1B5E20;background:#F1F8E9}
.vote-radio{width:20px;height:20px;border-radius:50%;border:2px solid #BDBDBD;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .18s}
.vote-option.selected .vote-radio{border-color:#1B5E20;background:#1B5E20}
.vote-radio-dot{width:8px;height:8px;border-radius:50%;background:white}
.vote-option-name{font-weight:500;font-size:14px}
.vote-option-mun{font-size:12px;color:#757575}
.arg-toggle{display:inline-flex;align-items:center;font-size:11px;color:#1B5E20;cursor:pointer;border:1px solid #C8E6C9;border-radius:20px;background:#F1F8E9;padding:4px 10px;font-family:'DM Sans',sans-serif;font-weight:600;flex-shrink:0;white-space:nowrap}
.arg-toggle:hover{background:#C8E6C9}
.arg-box{margin-top:10px;padding:10px 12px;background:#F9FBE7;border-left:3px solid #4CAF50;border-radius:0 8px 8px 0;font-size:12px;color:#424242;line-height:1.65;width:100%}
.estado-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600}
.estado-abierta{background:#E8F5E9;color:#1B5E20}
.estado-cerrada{background:#FFEBEE;color:#C62828}
.dot-live{width:8px;height:8px;border-radius:50%;background:#4CAF50;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
.empty{text-align:center;padding:48px 24px;color:#757575}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:600;margin-bottom:6px}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#F1F8E9 0%,#E8F5E9 100%);padding:24px}
.login-card{background:white;border-radius:20px;padding:48px 40px;max-width:440px;width:100%;box-shadow:0 8px 40px rgba(27,94,32,.12);text-align:center}
.login-logo{margin:0 auto 24px;display:block}
.login-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:900;color:#1B5E20;margin-bottom:8px}
.login-sub{font-size:14px;color:#757575;margin-bottom:32px;line-height:1.6}
.login-field{margin-bottom:16px;text-align:left}
.login-aviso{background:#FFF8E1;border:1px solid #FFD54F;border-radius:8px;padding:10px 14px;font-size:12px;color:#E65100;margin-bottom:20px;text-align:left;line-height:1.5}
.login-error{background:#FFEBEE;border:1px solid #EF9A9A;border-radius:8px;padding:10px 14px;font-size:13px;color:#C62828;margin-bottom:16px;font-weight:500}
.admin-field{display:none;margin-bottom:16px}
.char-count{font-size:11px;color:#757575;text-align:right;margin-top:4px}
@media(max-width:700px){.main{padding:16px}.header{padding:0 16px}.tab-bar-outer{padding:0 8px}.tab-btn{padding:6px 10px;font-size:11px}}
</style>
