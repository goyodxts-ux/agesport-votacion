<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premios Agesport 2025 - Votacion Granada</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#F1F8E9;color:#1A1A1A;min-height:100vh}
.app{min-height:100vh;display:flex;flex-direction:column}
.header{background:#1B5E20;padding:0 24px;display:flex;align-items:center;justify-content:space-between;min-height:64px;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.header-title{font-family:'Playfair Display',serif;color:white;font-size:17px;font-weight:700}
.header-sub{color:#C8E6C9;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.tab-bar{background:#1B5E20;padding:0 24px;display:flex;gap:4px;flex-wrap:wrap}
.tab-btn{padding:8px 14px;border:none;cursor:pointer;border-radius:6px 6px 0 0;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;transition:all .2s}
.tab-btn.active{background:#F1F8E9;color:#1B5E20}
.tab-btn.inactive{background:rgba(255,255,255,.15);color:rgba(255,255,255,.8)}
.tab-btn.inactive:hover{background:rgba(255,255,255,.25);color:white}
.main{flex:1;padding:24px;max-width:900px;margin:0 auto;width:100%}
.card{background:white;border-radius:16px;padding:24px;box-shadow:0 2px 16px rgba(27,94,32,.08);margin-bottom:20px}
.card-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:#1B5E20;margin-bottom:6px}
.card-sub{font-size:13px;color:#757575;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .18s}
.btn-primary{background:#1B5E20;color:white}.btn-primary:hover{background:#2E7D32}
.btn-secondary{background:#F5F5F5;color:#1A1A1A}.btn-secondary:hover{background:#E0E0E0}
.btn-danger{background:#FFEBEE;color:#C62828}
.btn-amber{background:#FFF8E1;color:#E65100}.btn-amber:hover{background:#FFECB3}
.btn-full{width:100%;justify-content:center;padding:13px;font-size:15px}
.btn-sm{padding:5px 12px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.input,.textarea{width:100%;padding:10px 13px;border:2px solid #E8F5E9;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:14px;color:#1A1A1A;outline:none;background:#F5F5F5;transition:border-color .2s}
.input:focus,.textarea:focus{border-color:#4CAF50;background:white}
.textarea{resize:vertical;min-height:85px;line-height:1.6}
.label{font-size:11px;font-weight:600;color:#757575;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;display:block}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.badge-green{background:#C8E6C9;color:#1B5E20}
.badge-amber{background:#FFF3E0;color:#BF360C}
.stat-box{background:#F1F8E9;border-radius:12px;padding:16px;text-align:center}
.stat-num{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;color:#1B5E20}
.stat-label{font-size:12px;color:#757575;margin-top:3px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.cat-num{width:30px;height:30px;border-radius:50%;background:#F1F8E9;color:#1B5E20;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.vote-cat{border:2px solid #E8F5E9;border-radius:14px;overflow:hidden;margin-bottom:16px}
.vote-cat.voted{border-color:#4CAF50}
.vote-cat-header{background:#F1F8E9;padding:13px 18px;display:flex;align-items:center;gap:10px}
.vote-option{display:flex;align-items:flex-start;gap:13px;padding:11px 15px;border-radius:10px;border:2px solid transparent;margin-bottom:7px;cursor:pointer;background:#F5F5F5;transition:all .18s}
.vote-option:hover{border-color:#C8E6C9;background:#F1F8E9}
.vote-option.selected{border-color:#1B5E20;background:#F1F8E9}
.vote-radio{width:20px;height:20px;border-radius:50%;border:2px solid #BDBDBD;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px}
.vote-option.selected .vote-radio{border-color:#1B5E20;background:#1B5E20}
.vote-radio-dot{width:8px;height:8px;border-radius:50%;background:white}
.arg-btn{font-size:11px;color:#1B5E20;cursor:pointer;border:1px solid #C8E6C9;border-radius:20px;background:#F1F8E9;padding:3px 9px;font-family:'DM Sans',sans-serif;font-weight:600;white-space:nowrap;margin-left:auto;flex-shrink:0}
.arg-box{margin-top:8px;padding:9px 11px;background:#F9FBE7;border-left:3px solid #4CAF50;border-radius:0 8px 8px 0;font-size:12px;color:#424242;line-height:1.6;display:none}
.estado-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600}
.estado-abierta{background:#E8F5E9;color:#1B5E20}
.estado-cerrada{background:#FFEBEE;color:#C62828}
.dot-live{width:7px;height:7px;border-radius:50%;background:#4CAF50;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.empty{text-align:center;padding:40px 20px;color:#757575}
.empty-icon{font-size:44px;margin-bottom:10px}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#F1F8E9,#E8F5E9);padding:20px}
.login-card{background:white;border-radius:20px;padding:40px 36px;max-width:420px;width:100%;box-shadow:0 8px 40px rgba(27,94,32,.12);text-align:center}
.login-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:900;color:#1B5E20;margin-bottom:8px}
.login-sub{font-size:13px;color:#757575;margin-bottom:28px;line-height:1.6}
.login-field{margin-bottom:14px;text-align:left}
.login-aviso{background:#FFF8E1;border:1px solid #FFD54F;border-radius:8px;padding:9px 13px;font-size:12px;color:#E65100;margin-bottom:18px;text-align:left;line-height:1.5}
.login-error{background:#FFEBEE;border:1px solid #EF9A9A;border-radius:8px;padding:9px 13px;font-size:13px;color:#C62828;margin-bottom:14px;font-weight:500;display:none}
.admin-pass-field{display:none;margin-bottom:14px;text-align:left}
.char-count{font-size:11px;color:#757575;text-align:right;margin-top:3px}
.prop-section{border:2px solid #E8F5E9;border-radius:14px;overflow:hidden;margin-bottom:16px}
.prop-header{background:linear-gradient(135deg,#FFF8E1,#FFF3E0);padding:13px 18px;display:flex;align-items:center;gap:10px}
.prop-form{padding:18px;display:none;border-top:1px solid #E8F5E9}
.result-cat{border:2px solid #E8F5E9;border-radius:14px;overflow:hidden;margin-bottom:18px}
.result-header{background:#1B5E20;padding:11px 18px;display:flex;justify-content:space-between;align-items:center}
.result-body{padding:14px 18px}
.result-row{margin-bottom:12px}
.bar-bg{height:9px;background:#F5F5F5;border-radius:9px;overflow:hidden}
.bar{height:100%;border-radius:9px;transition:width .5s}
@media(max-width:600px){.main{padding:14px}.grid-2,.grid-3{grid-template-columns:1fr}.header{padding:0 14px}.tab-bar{padding:0 8px}}
</style>
</head>

  function fbGet(path, cb) { db.ref(path).once("value").then(function(s){ cb(s.val()); }); }
  function fbSet(path, val) { return db.ref(path).set(val); }
  function fbPush(path, val) { return db.ref(path).push(val); }

  // Inicializar
  function init() {
    fbGet("estado", function(v){ estado = v||"abierta"; });
    fbGet("votos",  function(v){ votos  = v||{}; });
    fbGet("socios", function(v){ socios = v ? Object.values(v) : []; });
    fbGet("propuestas", function(v){ propuestas = v ? Object.values(v) : []; });
    setTimeout(renderLogin, 500);
    // Escuchar cambios en tiempo real
    db.ref("votos").on("value", function(s){ votos = s.val()||{}; });
    db.ref("estado").on("value", function(s){ estado = s.val()||"abierta"; });
    db.ref("socios").on("value", function(s){ socios = s.val() ? Object.values(s.val()) : []; });
  }

  // Utilidades
  function sk(s){ return s.replace(/[.#$\[\]]/g,"_"); }
  function numCat(id){ return id.replace("c","").replace(/^(\d)(\d)/,"$1.$2").replace(/^(\d)(\d)(\d)/,"$1.$2$3"); }
  function el(id){ return document.getElementById(id); }
  function setHTML(id,h){ var e=el(id); if(e) e.innerHTML=h; }

  // ── LOGIN ──────────────────────────────────────────────────────────────────
  function renderLogin() {
    el("root").innerHTML =
      '<div class="login-wrap">'+
        '<div class="login-card">'+
          '<img src="'+LOGO_ROUND+'" style="width:85px;height:85px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 20px">'+
          '<div class="login-title">Premios Agesport 2025</div>'+
          '<div class="login-sub">Introduce tus datos para acceder a la votacion.<br>Cada socio solo puede votar una vez.</div>'+
          '<div class="login-error" id="login-err"></div>'+
          '<div class="login-field"><label class="label">Nombre completo *</label><input class="input" id="inp-nombre" placeholder="Tu nombre y apellidos"></div>'+
          '<div class="login-field"><label class="label">Email *</label><input class="input" id="inp-email" type="email" placeholder="tucorreo@ejemplo.com" oninput="checkAdminField()"></div>'+
          '<div class="admin-pass-field" id="admin-pass-wrap"><label class="label">Contrasenia de administrador</label><input class="input" id="inp-pass" type="password" placeholder="Contrasenia"></div>'+
          '<div class="login-aviso">Tu email se usa unicamente para evitar votos duplicados.</div>'+
          '<button class="btn btn-primary btn-full" onclick="doLogin()">Acceder a la votacion</button>'+
          '<img src="'+LOGO_BANNER+'" style="width:100%;max-width:280px;margin-top:22px;opacity:.7">'+
        '</div>'+
      '</div>';
  }

  window.checkAdminField = function() {
    var email = el("inp-email") ? el("inp-email").value.trim().toLowerCase() : "";
    var wrap  = el("admin-pass-wrap");
    if (wrap) wrap.style.display = (email === ADMIN_EMAIL) ? "block" : "none";
  };

  window.doLogin = function() {
    var nombre = el("inp-nombre") ? el("inp-nombre").value.trim() : "";
    var email  = el("inp-email")  ? el("inp-email").value.trim().toLowerCase() : "";
    var errDiv = el("login-err");
    if (!nombre || nombre.length < 2) { errDiv.textContent="Escribe tu nombre completo"; errDiv.style.display="block"; return; }
    if (!email || email.indexOf("@") < 0) { errDiv.textContent="Email no valido"; errDiv.style.display="block"; return; }
    if (email === ADMIN_EMAIL) {
      var pass = el("inp-pass") ? el("inp-pass").value : "";
      if (pass === ADMIN_PASS) {
        socioActual = {nombre:nombre, email:email, esAdmin:true, haVotado:false};
        seleccion = {};
        renderApp();
        return;
      } else if (pass !== "") {
        errDiv.textContent="Contrasenia de administrador incorrecta"; errDiv.style.display="block"; return;
      }
    }
    var yaVoto = socios.find(function(s){ return s.email===email; });
    if (yaVoto) { errDiv.textContent="Este email ya voto el "+yaVoto.fecha+". Solo se puede votar una vez."; errDiv.style.display="block"; return; }
    socioActual = {nombre:nombre, email:email, esAdmin:false, haVotado:false};
    seleccion = {};
    renderApp();
  };

  // ── APP ────────────────────────────────────────────────────────────────────
  function renderApp() {
    el("root").innerHTML =
      '<div class="app">'+
        '<header class="header">'+
          '<div style="display:flex;align-items:center;gap:10px">'+
            '<img src="'+LOGO_ROUND+'" style="width:40px;height:40px;border-radius:50%;object-fit:cover">'+
            '<div><div class="header-title">Premios Agesport 2025</div><div class="header-sub">Delegacion Provincial de Granada</div></div>'+
          '</div>'+
          '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+
            '<div style="text-align:right"><div style="color:white;font-size:13px;font-weight:600">'+socioActual.nombre+(socioActual.esAdmin?' <span style="background:#F9A825;color:#1A1A1A;border-radius:4px;padding:1px 5px;font-size:10px">ADMIN</span>':'')+'</div><div style="color:rgba(255,255,255,.6);font-size:11px">'+socioActual.email+'</div></div>'+
            '<button class="tab-btn inactive" onclick="doSalir()">Salir</button>'+
          '</div>'+
        '</header>'+
        '<div style="background:white;border-bottom:1px solid #E8F5E9;display:flex;justify-content:center"><img src="'+LOGO_BANNER+'" style="max-width:440px;width:100%;max-height:68px;object-fit:contain;padding:5px 20px"></div>'+
        '<div class="tab-bar" id="tab-bar">'+
          '<button class="tab-btn active" onclick="showTab(this,'votar')">Votar</button>'+
          '<button class="tab-btn inactive" onclick="showTab(this,'proponer')">Proponer</button>'+
          (socioActual.haVotado||socioActual.esAdmin ? '<button class="tab-btn inactive" onclick="showTab(this,'resultados')">Resultados</button>' : '')+
          (socioActual.esAdmin ? '<button class="tab-btn inactive" onclick="showTab(this,'admin')">Admin</button>' : '')+
        '</div>'+
        '<main class="main" id="main-content"></main>'+
      '</div>';
    renderVotar();
  }

  window.doSalir = function() { socioActual=null; renderLogin(); };

  window.showTab = function(btn, tab) {
    var btns = document.querySelectorAll(".tab-btn");
    btns.forEach(function(b){ b.className="tab-btn inactive"; });
    btn.className="tab-btn active";
    if (tab==="votar")      renderVotar();
    else if (tab==="proponer")   renderProponer();
    else if (tab==="resultados") renderResultados();
    else if (tab==="admin")      renderAdmin();
  };

  // ── VOTAR ──────────────────────────────────────────────────────────────────
  function renderVotar() {
    if (estado==="cerrada") { setHTML("main-content","<div class='card'><div class='empty'><div class='empty-icon'>&#128274;</div><div class='empty-title'>Votacion cerrada</div></div></div>"); return; }
    var total   = CATS.length;
    var votadas = Object.keys(seleccion).length;
    var pct     = total>0 ? Math.round(votadas/total*100) : 0;
    var h = '<div class="card" style="padding:18px 24px;margin-bottom:14px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'+
      '<span style="font-weight:600;font-size:14px">Progreso: '+votadas+' de '+total+' categorias</span>'+
      '<span class="estado-pill estado-abierta"><span class="dot-live"></span>Abierta</span></div>'+
      '<div style="height:7px;background:#F5F5F5;border-radius:7px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,#1B5E20,#4CAF50);border-radius:7px;transition:width .4s"></div></div>'+
      '</div>';
    CATS.forEach(function(cat) {
      var sel = seleccion[cat.id];
      h += '<div class="vote-cat'+(sel?" voted":"")+'" style="margin-bottom:14px">'+
        '<div class="vote-cat-header">'+
        '<div class="cat-num">'+numCat(cat.id)+'</div>'+
        '<div style="flex:1"><div style="font-weight:700;font-size:14px;color:#1B5E20">'+cat.n+'</div><div style="font-size:12px;color:#757575">'+cat.cands.length+' candidaturas</div></div>'+
        (sel?'<span class="badge badge-green">Votado</span>':'')+
        '</div><div style="padding:14px 18px">';
      cat.cands.forEach(function(c) {
        var cid = "opt_"+cat.id+"_"+sk(c.n);
        h += '<div class="vote-option'+(sel===c.n?" selected":"")+'" onclick="selectCand(''+cat.id+'',''+c.n.replace(/'/g,"\'")+'')" style="flex-direction:column;align-items:flex-start">'+
          '<div style="display:flex;align-items:center;gap:12px;width:100%">'+
          '<div class="vote-radio">'+(sel===c.n?'<div class="vote-radio-dot"></div>':'')+'</div>'+
          '<div style="flex:1"><div style="font-weight:500;font-size:14px">'+c.n+'</div><div style="font-size:11px;color:#757575">&#128205; '+c.m+'</div></div>'+
          (c.a?'<button class="arg-btn" onclick="event.stopPropagation();toggleArg(''+cid+'',this)">Ver motivos</button>':'')+
          '</div>'+
          (c.a?'<div class="arg-box" id="'+cid+'">'+c.a+'</div>':'')+
          '</div>';
      });
      h += '</div></div>';
    });
    h += '<div class="card" style="padding:18px 24px"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">'+
      '<span style="color:#757575;font-size:13px">'+(votadas===0?"Selecciona al menos una candidatura":votadas<total?"Faltan "+(total-votadas)+" categorias":"Todas las categorias votadas!")+'</span>'+
      '<button class="btn btn-primary" '+(votadas===0?"disabled":"")+' onclick="enviarVotos()">Enviar votos ('+votadas+')</button>'+
      '</div></div>';
    setHTML("main-content", h);
  }

  window.selectCand = function(catId, candN) {
    seleccion[catId] = candN;
    renderVotar();
  };

  window.toggleArg = function(id, btn) {
    var box = el(id);
    if (!box) return;
    var vis = box.style.display==="block";
    box.style.display = vis?"none":"block";
    btn.textContent = vis?"Ver motivos":"Ocultar";
  };

  window.enviarVotos = function() {
    if (Object.keys(seleccion).length===0) return;
    var newVotos = JSON.parse(JSON.stringify(votos));
    Object.keys(seleccion).forEach(function(catId) {
      var cand = seleccion[catId];
      var ck = sk(cand);
      if (!newVotos[catId]) newVotos[catId]={};
      newVotos[catId][ck] = (newVotos[catId][ck]||0)+1;
    });
    fbSet("votos", newVotos).then(function(){
      var fecha = new Date().toLocaleString("es-ES");
      fbPush("socios", {nombre:socioActual.nombre, email:socioActual.email, fecha:fecha});
      socios.push({nombre:socioActual.nombre, email:socioActual.email, fecha:fecha});
      socioActual.haVotado = true;
      var tabBar = el("tab-bar");
      if (tabBar) {
        tabBar.innerHTML =
          '<button class="tab-btn inactive" onclick="showTab(this,'votar')">Votar</button>'+
          '<button class="tab-btn inactive" onclick="showTab(this,'proponer')">Proponer</button>'+
          '<button class="tab-btn active" onclick="showTab(this,'resultados')">Resultados</button>'+
          (socioActual.esAdmin?'<button class="tab-btn inactive" onclick="showTab(this,'admin')">Admin</button>':'');
      }
      setHTML("main-content",
        '<div class="card" style="text-align:center;padding:56px 28px">'+
        '<div style="font-size:60px;margin-bottom:14px">&#127942;</div>'+
        '<div class="card-title" style="text-align:center;font-size:22px;margin-bottom:8px">Gracias por tu voto!</div>'+
        '<div style="color:#757575;font-size:13px;margin-bottom:20px">Tu voto ha sido registrado en '+Object.keys(seleccion).length+' categorias.</div>'+
        '<button class="btn btn-primary" onclick="showTab(document.querySelector('.tab-btn.active'),'resultados')">Ver resultados en tiempo real</button>'+
        '</div>');
    }).catch(function(e){ alert("Error al enviar: "+e.message); });
  };

  // ── PROPONER ───────────────────────────────────────────────────────────────
  function renderProponer() {
    if (estado==="cerrada") { setHTML("main-content","<div class='card'><div class='empty'><div class='empty-icon'>&#128274;</div><div class='empty-title'>Votacion cerrada</div></div></div>"); return; }
    var h = '<div class="card"><div class="card-title">Proponer candidatura</div><div class="card-sub">Propona una candidatura adicional en cualquier categoria. Es obligatorio argumentar al menos 80 caracteres. El administrador la revisara antes de incluirla en la votacion.</div></div>';
    CATS.forEach(function(cat) {
      var cid = cat.id;
      h += '<div class="prop-section">'+
        '<div class="prop-header">'+
        '<div class="cat-num" style="background:#FFF8E1;color:#E65100">'+numCat(cid)+'</div>'+
        '<div style="flex:1"><div style="font-weight:700;font-size:14px">'+cat.n+'</div></div>'+
        '<button id="pbtn-'+cid+'" class="btn btn-amber btn-sm" onclick="togglePropForm(''+cid+'')">+ Proponer</button>'+
        '</div>'+
        '<div class="prop-form" id="pform-'+cid+'">'+
        '<div class="grid-2" style="margin-bottom:12px">'+
        '<div><label class="label">Candidato / entidad *</label><input id="pnom-'+cid+'" class="input" placeholder="Nombre completo"></div>'+
        '<div><label class="label">Municipio</label><input id="pmun-'+cid+'" class="input" placeholder="Municipio"></div>'+
        '</div>'+
        '<div style="margin-bottom:12px"><label class="label">Por que merece este premio? (min. 80 caracteres) *</label>'+
        '<textarea id="parg-'+cid+'" class="textarea" placeholder="Argumenta los meritos del candidato..." maxlength="600" oninput="updateChar(''+cid+'')"></textarea>'+
        '<div id="pchar-'+cid+'" class="char-count">0/600</div></div>'+
        '<div style="margin-bottom:14px;padding:8px 11px;background:#F1F8E9;border-radius:8px;font-size:13px;color:#2E7D32">Propuesta en nombre de: <strong>'+socioActual.nombre+'</strong></div>'+
        '<div style="display:flex;gap:10px">'+
        '<button class="btn btn-primary" onclick="enviarProp(''+cid+'')">Enviar propuesta</button>'+
        '<button class="btn btn-secondary" onclick="togglePropForm(''+cid+'')">Cancelar</button>'+
        '</div></div></div>';
    });
    setHTML("main-content", h);
  }

  window.togglePropForm = function(cid) {
    var form = el("pform-"+cid);
    var btn  = el("pbtn-"+cid);
    if (!form) return;
    var vis = form.style.display==="block";
    form.style.display = vis?"none":"block";
    if (btn) btn.textContent = vis?"+ Proponer":"Cancelar";
  };

  window.updateChar = function(cid) {
    var ta = el("parg-"+cid);
    var ch = el("pchar-"+cid);
    if (ta&&ch) { ch.textContent=ta.value.length+"/600"; ch.style.color=ta.value.length<80?"#E65100":"#757575"; }
  };

  window.enviarProp = function(cid) {
    var nom = el("pnom-"+cid) ? el("pnom-"+cid).value.trim() : "";
    var mun = el("pmun-"+cid) ? el("pmun-"+cid).value.trim() : "";
    var arg = el("parg-"+cid) ? el("parg-"+cid).value.trim() : "";
    if (!nom||nom.length<2) { alert("Escribe el nombre del candidato"); return; }
    if (!arg||arg.length<80) { alert("El argumento debe tener al menos 80 caracteres (tienes "+arg.length+")"); return; }
    var nueva = {id:"p"+Date.now(), catId:cid, nombre:nom, municipio:mun||"—", argumento:arg, socio:socioActual.nombre, fecha:new Date().toLocaleString("es-ES"), aprobada:false};
    fbPush("propuestas", nueva).then(function(){
      propuestas.push(nueva);
      alert("Propuesta enviada. El administrador la revisara antes de publicarla.");
      togglePropForm(cid);
      if(el("pnom-"+cid)) el("pnom-"+cid).value="";
      if(el("pmun-"+cid)) el("pmun-"+cid).value="";
      if(el("parg-"+cid)) el("parg-"+cid).value="";
    }).catch(function(e){ alert("Error: "+e.message); });
  };

  // ── RESULTADOS ─────────────────────────────────────────────────────────────
  function renderResultados() {
    var totalVotos = 0;
    Object.values(votos).forEach(function(cv){ Object.values(cv).forEach(function(v){ totalVotos+=v; }); });
    var h = '<div class="card">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px">'+
      '<div><div class="card-title">Resultados en tiempo real</div><div class="card-sub" style="margin-bottom:0">Actualizacion automatica</div></div>'+
      '<span class="estado-pill '+(estado==="abierta"?"estado-abierta":"estado-cerrada")+'">'+(estado==="abierta"?'<span class="dot-live"></span>En curso':"Cerrada")+'</span>'+
      '</div>'+
      '<div class="grid-2"><div class="stat-box"><div class="stat-num">'+CATS.length+'</div><div class="stat-label">Categorias</div></div>'+
      '<div class="stat-box"><div class="stat-num">'+totalVotos+'</div><div class="stat-label">Votos totales</div></div></div></div>';

    CATS.forEach(function(cat) {
      var cv = votos[cat.id]||{};
      var total = 0;
      Object.values(cv).forEach(function(v){ total+=v; });
      var sorted = cat.cands.slice().sort(function(a,b){ return (cv[sk(b.n)]||0)-(cv[sk(a.n)]||0); });
      var maxV = sorted.length>0 ? (cv[sk(sorted[0].n)]||0) : 0;
      h += '<div class="result-cat">'+
        '<div class="result-header">'+
        '<div style="display:flex;align-items:center;gap:8px">'+
        '<span style="background:rgba(255,255,255,.2);border-radius:6px;padding:2px 7px;font-size:11px;color:white;font-weight:700">'+numCat(cat.id)+'</span>'+
        '<span style="color:white;font-weight:600;font-size:13px">'+cat.n+'</span>'+
        '</div><span style="color:#C8E6C9;font-size:12px">'+total+' votos</span></div>'+
        '<div class="result-body">';
      sorted.forEach(function(c,i) {
        var v   = cv[sk(c.n)]||0;
        var pct2 = maxV>0 ? Math.round(v/maxV*100) : 0;
        var win = i===0&&v>0;
        h += '<div class="result-row">'+
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">'+
          '<div style="display:flex;align-items:center;gap:7px">'+
          (win?'<span style="font-size:16px">&#127942;</span>':'')+
          '<div style="font-weight:'+(win?700:500)+';font-size:13px;color:'+(win?"#1B5E20":"#1A1A1A")+'">'+c.n+'</div></div>'+
          '<div style="font-weight:700;font-size:13px;color:#1B5E20">'+v+' votos'+(total>0?' - '+Math.round(v/total*100)+'%':'')+'</div></div>'+
          '<div class="bar-bg"><div class="bar" style="width:'+pct2+'%;background:'+(win?"linear-gradient(90deg,#1B5E20,#4CAF50)":"#C8E6C9")+'"></div></div>'+
          '</div>';
      });
      h += '</div></div>';
    });
    setHTML("main-content", h);

    // Refrescar cada 5 segundos si estamos en resultados
    setTimeout(function(){
      var main = el("main-content");
      if (main && main.innerHTML.indexOf("result-cat")>-1) renderResultados();
    }, 5000);
  }

  // ── ADMIN ──────────────────────────────────────────────────────────────────
  function renderAdmin() {
    var pending  = propuestas.filter(function(p){ return !p.aprobada; });
    var approved = propuestas.filter(function(p){ return p.aprobada; });
    var totalVotos = 0;
    Object.values(votos).forEach(function(cv){ Object.values(cv).forEach(function(v){ totalVotos+=v; }); });

    var h = '<div class="card"><div class="card-title">Panel de administracion</div>'+
      '<div class="grid-3" style="margin-bottom:18px">'+
      '<div class="stat-box"><div class="stat-num">'+socios.length+'</div><div class="stat-label">Socios votantes</div></div>'+
      '<div class="stat-box"><div class="stat-num">'+totalVotos+'</div><div class="stat-label">Votos registrados</div></div>'+
      '<div class="stat-box"><div class="stat-num" style="color:'+(pending.length>0?"#E65100":"#1B5E20")+'">'+pending.length+'</div><div class="stat-label">Propuestas pendientes</div></div>'+
      '</div>'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap">'+
      '<button class="btn '+(estado==="abierta"?"btn-danger":"btn-primary")+'" onclick="toggleEstado()">'+(estado==="abierta"?"Cerrar votacion":"Abrir votacion")+'</button>'+
      '<button class="btn btn-secondary" onclick="resetVotos()">Reiniciar votos</button>'+
      '<button class="btn btn-secondary" onclick="resetSocios()">Reiniciar socios</button>'+
      '</div></div>';

    if (pending.length>0) {
      h += '<div class="card"><div class="card-title" style="font-size:16px;color:#E65100">Propuestas pendientes ('+pending.length+')</div>';
      pending.forEach(function(p) {
        var cat = CATS.find(function(c){ return c.id===p.catId; });
        h += '<div style="border:2px solid #FFD54F;background:#FFFDE7;border-radius:12px;padding:15px;margin-bottom:10px">'+
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">'+
          '<div><div style="font-size:11px;font-weight:700;color:#1B5E20;text-transform:uppercase">'+(cat?numCat(cat.id)+' - '+cat.n:'')+'</div>'+
          '<div style="font-weight:700;font-size:14px;margin:3px 0">'+p.nombre+'</div>'+
          '<div style="font-size:12px;color:#757575">'+p.municipio+' - '+p.socio+' - '+p.fecha+'</div></div>'+
          '<div style="display:flex;gap:7px">'+
          '<button class="btn btn-primary btn-sm" onclick="aprobarProp(''+p.id+'')">Aprobar</button>'+
          '<button class="btn btn-danger btn-sm" onclick="rechazarProp(''+p.id+'')">Rechazar</button>'+
          '</div></div>'+
          '<div style="margin-top:9px;padding-top:9px;border-top:1px solid #FFD54F;font-size:13px;line-height:1.6">'+p.argumento+'</div>'+
          '</div>';
      });
      h += '</div>';
    }

    if (socios.length>0) {
      h += '<div class="card"><div class="card-title" style="font-size:16px">Socios votantes ('+socios.length+')</div>'+
        '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">'+
        '<thead><tr style="background:#F1F8E9"><th style="padding:9px 12px;text-align:left;color:#1B5E20;border-bottom:2px solid #C8E6C9">#</th>'+
        '<th style="padding:9px 12px;text-align:left;color:#1B5E20;border-bottom:2px solid #C8E6C9">Nombre</th>'+
        '<th style="padding:9px 12px;text-align:left;color:#1B5E20;border-bottom:2px solid #C8E6C9">Email</th>'+
        '<th style="padding:9px 12px;text-align:left;color:#1B5E20;border-bottom:2px solid #C8E6C9">Fecha</th>'+
        '<th style="padding:9px 12px;text-align:center;color:#1B5E20;border-bottom:2px solid #C8E6C9">Accion</th></tr></thead><tbody>';
      socios.forEach(function(s,i) {
        h += '<tr style="border-bottom:1px solid #E8F5E9;background:'+(i%2===0?'white':'#F9FBE7')+'">'+
          '<td style="padding:9px 12px;color:#757575">'+(i+1)+'</td>'+
          '<td style="padding:9px 12px;font-weight:600">'+s.nombre+'</td>'+
          '<td style="padding:9px 12px;color:#757575">'+s.email+'</td>'+
          '<td style="padding:9px 12px;color:#757575">'+s.fecha+'</td>'+
          '<td style="padding:9px 12px;text-align:center"><button class="btn btn-danger btn-sm" onclick="delSocio(''+s.email+'')">X</button></td>'+
          '</tr>';
      });
      h += '</tbody></table></div></div>';
    }

    setHTML("main-content", h);
  }

  window.toggleEstado = function() {
    estado = estado==="abierta"?"cerrada":"abierta";
    fbSet("estado", estado).then(function(){ renderAdmin(); });
  };
  window.resetVotos = function() {
    if (!confirm("Seguro que quieres reiniciar todos los votos?")) return;
    fbSet("votos",{}).then(function(){ votos={}; renderAdmin(); });
  };
  window.resetSocios = function() {
    if (!confirm("Seguro que quieres reiniciar la lista de socios?")) return;
    fbSet("socios",{}).then(function(){ socios=[]; renderAdmin(); });
  };
  window.aprobarProp = function(pid) {
    fbGet("propuestas", function(raw) {
      if (!raw) return;
      var key = Object.keys(raw).find(function(k){ return raw[k].id===pid; });
      if (key) {
        db.ref("propuestas/"+key+"/aprobada").set(true).then(function(){
          propuestas = propuestas.map(function(p){ return p.id===pid?Object.assign({},p,{aprobada:true}):p; });
          renderAdmin();
        });
      }
    });
  };
  window.rechazarProp = function(pid) {
    fbGet("propuestas", function(raw) {
      if (!raw) return;
      var key = Object.keys(raw).find(function(k){ return raw[k].id===pid; });
      if (key) {
        db.ref("propuestas/"+key).remove().then(function(){
          propuestas = propuestas.filter(function(p){ return p.id!==pid; });
          renderAdmin();
        });
      }
    });
  };
  window.delSocio = function(email) {
    fbGet("socios", function(raw) {
      if (!raw) return;
      var key = Object.keys(raw).find(function(k){ return raw[k].email===email; });
      if (key) {
        db.ref("socios/"+key).remove().then(function(){
          socios = socios.filter(function(s){ return s.email!==email; });
          renderAdmin();
        });
      }
    });
  };

  init();
})();
</script>
</body>
</html>
