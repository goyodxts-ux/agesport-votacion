<title>Resultados Premios Agesport 2025 - Granada</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",sans-serif;background:#F1F8E9;color:#1A1A1A;min-height:100vh}
.hdr{background:#1B5E20;padding:0 20px;display:flex;align-items:center;justify-content:center;min-height:60px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.main{padding:18px;max-width:860px;margin:0 auto;width:100%}
.card{background:white;border-radius:14px;padding:20px;box-shadow:0 2px 12px rgba(27,94,32,.07);margin-bottom:16px}
.ct{font-family:"Playfair Display",serif;font-size:18px;font-weight:700;color:#1B5E20;margin-bottom:5px}
.cs{font-size:12px;color:#757575;margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sb{background:#F1F8E9;border-radius:10px;padding:14px;text-align:center}
.sn{font-family:"Playfair Display",serif;font-size:28px;font-weight:900;color:#1B5E20}
.sl{font-size:11px;color:#757575;margin-top:2px}
.ep{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:18px;font-size:11px;font-weight:600}
.ea{background:#E8F5E9;color:#1B5E20}
.ec{background:#FFEBEE;color:#C62828}
.dl{width:7px;height:7px;border-radius:50%;background:#4CAF50;animation:pu 1.4s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.35}}
.rc{border:2px solid #E8F5E9;border-radius:12px;overflow:hidden;margin-bottom:14px}
.rh{background:#1B5E20;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
.rb{padding:12px 16px}
.rrow{margin-bottom:10px}
.bb{height:8px;background:#F5F5F5;border-radius:8px;overflow:hidden}
.br{height:100%;border-radius:8px;transition:width .6s}
.upd{text-align:center;font-size:11px;color:#BDBDBD;padding:8px 0 16px}
@media(max-width:580px){.main{padding:10px}.g2{grid-template-columns:1fr}}
</style>
</head>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyD1_BTfUHlrl4ivqb2ivscuYO2TfAapbGk",
  authDomain:"premios-agesport--granada.firebaseapp.com",
  databaseURL:"https://premios-agesport--granada-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"premios-agesport--granada",
  storageBucket:"premios-agesport--granada.firebasestorage.app",
  messagingSenderId:"884532121492",
  appId:"1:884532121492:web:08306789e2f23e6b018981"

var db=firebase.database();
var CATS=[
  {id:"c21",num:"2.1",n:"Gestor/a del Deporte",cands:[{n:"Javier Luna Quesada",m:"Granada"},{n:"Jacinto Garzon Jimenez",m:"Guadix"}]},
  {id:"c22",num:"2.2",n:"Evento Deportivo",cands:[{n:"41a Media Maraton Ciudad de Granada",m:"Granada"},{n:"Campeonato Espania BTT XCO",m:"Baza"}]},
  {id:"c23",num:"2.3",n:"Industria del Deporte",cands:[{n:"HSN Health Supplement Nutrition",m:"Escuzar"},{n:"Campos de Granada",m:"Motril"}]},
  {id:"c24",num:"2.4",n:"Patrocinio y Mecenazgo",cands:[{n:"Coviran Granada",m:"Granada"},{n:"Caja Rural Granada",m:"Granada"}]},
  {id:"c25",num:"2.5",n:"Entidad Deportiva Tercer Sector",cands:[{n:"Fundacion CB Granada",m:"Granada"},{n:"Club Atletismo Ciudad de Motril",m:"Motril"}]},
  {id:"c26",num:"2.6",n:"Comunicacion en el Deporte",cands:[{n:"Asoc. Granadina Periodistas Deportivos",m:"Granada"},{n:"GranadaDigital Deporte",m:"Granada"}]},
  {id:"c27",num:"2.7",n:"Mujer y Deporte",cands:[{n:"Granada CF Femenino",m:"Granada"},{n:"Pipi Cardell",m:"Monachil"}]},
  {id:"c28",num:"2.8",n:"Infraestructura Deportiva",cands:[{n:"Ciudad Deportiva Diputacion Granada",m:"Armilla"},{n:"Complejo Deportivo El Hoyo",m:"Guejar Sierra"}]},
  {id:"c29",num:"2.9",n:"Creacion de Conocimiento",cands:[{n:"Programa Wadisalud Guadix UGR",m:"Guadix"},{n:"Circuitos BTT Diputacion de Granada",m:"Provincia"}]},
  {id:"c210",num:"2.10",n:"Gestion Deportiva Municipal",cands:[{n:"Ayuntamiento de Guadix",m:"Guadix"},{n:"Ayuntamiento de Baza",m:"Baza"}]},
  {id:"c211",num:"2.11",n:"Sostenibilidad en la Gestion",cands:[{n:"Cetursa Sierra Nevada SA",m:"Monachil"},{n:"TerraIncognita Sport Ultra Sierra Nevada",m:"Granada"}]},
  {id:"c212",num:"2.12",n:"Deporte para Siempre",cands:[{n:"Maria Perez Garcia",m:"Orce"},{n:"Teresa Moya Garciolo",m:"Almuniecar"}]},
];

function sk(s){return s.replace(/[.#$\[\]]/g,"_")}

var votos={},estado="abierta",socios=[];

function render(){
  var tv=0;
  Object.values(votos).forEach(function(cv){Object.values(cv).forEach(function(v){tv+=v})});
  var ns=socios.length;
  var main=document.getElementById("main");
  var el=document.createElement("div");

  var hcard=document.createElement("div");
  hcard.className="card";
  hcard.innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px">'+
    '<div>'+
    '<div class="ct">Resultados Premios Agesport 2025</div>'+
    '<div class="cs" style="margin-bottom:0">Delegacion Provincial de Granada</div>'+
    '</div>'+
    '<span class="ep '+(estado==="abierta"?"ea":"ec")+'">'+(estado==="abierta"?'<span class="dl"></span>Votacion en curso':"&#128274; Votacion cerrada")+'</span>'+
    '</div>'+
    '<div class="g2">'+
    '<div class="sb"><div class="sn">'+tv+'</div><div class="sl">Votos emitidos</div></div>'+
    '<div class="sb"><div class="sn">'+ns+'</div><div class="sl">Socios participantes</div></div>'+
    '</div>';
  el.appendChild(hcard);

  CATS.forEach(function(cat){
    var cv=votos[cat.id]||{};
    var tot=0;Object.values(cv).forEach(function(v){tot+=v});
    var sorted=cat.cands.slice().sort(function(a,b){return(cv[sk(b.n)]||0)-(cv[sk(a.n)]||0)});
    var maxv=sorted.length>0?(cv[sk(sorted[0].n)]||0):0;

    var rcard=document.createElement("div");
    rcard.className="rc";

    var rhdr=document.createElement("div");
    rhdr.className="rh";
    rhdr.innerHTML=
      '<div style="display:flex;align-items:center;gap:7px">'+
      '<span style="background:rgba(255,255,255,.2);border-radius:5px;padding:2px 7px;font-size:11px;color:white;font-weight:700">'+cat.num+'</span>'+
      '<span style="color:white;font-weight:600;font-size:12px">'+cat.n+'</span>'+
      '</div>'+
      '<span style="color:#C8E6C9;font-size:11px">'+tot+' voto'+(tot!==1?"s":"")+'</span>';

    var rbody=document.createElement("div");
    rbody.className="rb";

    sorted.forEach(function(c,i){
      var v=cv[sk(c.n)]||0;
      var pct=maxv>0?Math.round(v/maxv*100):0;
      var win=i===0&&v>0;
      var rrow=document.createElement("div");
      rrow.className="rrow";
      rrow.innerHTML=
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'+
        '<div style="display:flex;align-items:center;gap:6px">'+
        (win?'<span style="font-size:15px">&#127942;</span>':'')+
        '<div>'+
        '<div style="font-weight:'+(win?700:400)+';font-size:12px;color:'+(win?"#1B5E20":"#333")+'">'+c.n+'</div>'+
        '<div style="font-size:10px;color:#999">&#128205; '+c.m+'</div>'+
        '</div></div>'+
        '<div style="font-weight:700;font-size:12px;color:#1B5E20;white-space:nowrap">'+v+' voto'+(v!==1?"s":"")+(tot>0?" &middot; "+Math.round(v/tot*100)+"%":"")+'</div>'+
        '</div>'+
        '<div class="bb"><div class="br" style="width:'+pct+'%;background:'+(win?"linear-gradient(90deg,#1B5E20,#4CAF50)":"#C8E6C9")+'"></div></div>';
      rbody.appendChild(rrow);
    });

    rcard.appendChild(rhdr);
    rcard.appendChild(rbody);
    el.appendChild(rcard);
  });

  var upd=document.createElement("div");
  upd.className="upd";
  upd.textContent="Ultima actualizacion: "+new Date().toLocaleTimeString("es-ES")+" &middot; Se actualiza automaticamente";
  el.appendChild(upd);

  main.innerHTML="";
  main.appendChild(el);
}

db.ref("votos").on("value",function(s){votos=s.val()||{};render()});
db.ref("estado").on("value",function(s){estado=s.val()||"abierta";render()});
db.ref("socios").on("value",function(s){socios=s.val()?Object.values(s.val()):[];render()});
</script>
