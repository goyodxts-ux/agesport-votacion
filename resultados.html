<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultados Premios Agesport 2025 — Granada</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#F1F8E9;color:#1A1A1A;min-height:100vh}
.header{background:#1B5E20;padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:64px;box-shadow:0 2px 12px rgba(0,0,0,0.3)}
.header-title{font-family:'Playfair Display',serif;color:white;font-size:18px;font-weight:700}
.header-sub{color:#C8E6C9;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.main{padding:32px;max-width:900px;margin:0 auto}
.card{background:white;border-radius:16px;padding:28px;box-shadow:0 2px 16px rgba(27,94,32,.08);margin-bottom:24px}
.card-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:#1B5E20;margin-bottom:6px}
.card-sub{font-size:13px;color:#757575;margin-bottom:16px}
.stat-box{background:#F1F8E9;border-radius:12px;padding:18px;text-align:center}
.stat-num{font-family:'Playfair Display',serif;font-size:36px;font-weight:900;color:#1B5E20}
.stat-label{font-size:12px;color:#757575;margin-top:4px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.result-cat{border:2px solid #E8F5E9;border-radius:14px;overflow:hidden;margin-bottom:20px}
.result-header{background:#1B5E20;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.result-header-title{color:white;font-weight:600;font-size:14px}
.result-header-total{color:#C8E6C9;font-size:12px}
.result-body{padding:16px 20px}
.result-row{margin-bottom:14px}
.result-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.result-name{font-weight:500;font-size:13px}
.result-votes{font-weight:700;font-size:13px;color:#1B5E20}
.bar-bg{height:10px;background:#F5F5F5;border-radius:10px;overflow:hidden}
.bar{height:100%;border-radius:10px;transition:width .6s}
.bar-win{background:linear-gradient(90deg,#1B5E20,#4CAF50)}
.bar-lose{background:#C8E6C9}
.estado-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600}
.estado-abierta{background:#E8F5E9;color:#1B5E20}
.estado-cerrada{background:#FFEBEE;color:#C62828}
.dot-live{width:8px;height:8px;border-radius:50%;background:#4CAF50;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
@media(max-width:600px){.main{padding:16px}.grid-2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header">
  <div style="display:flex;align-items:center;gap:12px">
    <div style="width:40px;height:40px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:900;color:#1B5E20;font-size:14px">AG</div>
    <div>
      <div class="header-title">Premios Agesport 2025</div>
      <div class="header-sub">Resultados — Delegación Provincial de Granada</div>
    </div>
  </div>
  <div id="estado-pill" class="estado-pill estado-abierta"><div class="dot-live"></div>Cargando...</div>
</header>
<main class="main">
  <div class="card">
    <div class="card-title">Resultados en tiempo real</div>
    <div class="card-sub">Los resultados se actualizan automáticamente conforme llegan los votos</div>
    <div class="grid-2">
      <div class="stat-box"><div class="stat-num" id="total-votos">—</div><div class="stat-label">Votos totales</div></div>
      <div class="stat-box"><div class="stat-num" id="total-socios">—</div><div class="stat-label">Socios participantes</div></div>
    </div>
  </div>
  <div id="resultados-container"></div>
</main>

<script>
  firebase.initializeApp({
    apiKey: "AIzaSyD1_BTfUHlrl4ivqb2ivscuYO2TfAapbGk",
    authDomain: "premios-agesport--granada.firebaseapp.com",
    databaseURL: "https://premios-agesport--granada-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "premios-agesport--granada",
    storageBucket: "premios-agesport--granada.firebasestorage.app",
    messagingSenderId: "884532121492",
    appId: "1:884532121492:web:08306789e2f23e6b018981"
  });
  const db = firebase.database();

  const DEFAULT_CATS = [
    {id:"cat_2_1",  nombre:"Gestor/a del Deporte",           candidatos:[{nombre:"Javier Luna Quesada"},{nombre:"Jacinto Garzón Jiménez"}]},
    {id:"cat_2_2",  nombre:"Evento Deportivo",                candidatos:[{nombre:"41.ª Media Maratón Ciudad de Granada"},{nombre:"Campeonato España BTT XCO"}]},
    {id:"cat_2_3",  nombre:"Industria del Deporte",           candidatos:[{nombre:"HSN – Health Supplement Nutrition"},{nombre:"Campos de Granada"}]},
    {id:"cat_2_4",  nombre:"Patrocinio y Mecenazgo",          candidatos:[{nombre:"Covirán Granada"},{nombre:"Caja Rural Granada"}]},
    {id:"cat_2_5",  nombre:"Entidad Deportiva Tercer Sector", candidatos:[{nombre:"Fundación CB Granada"},{nombre:"Club Atletismo Ciudad de Motril"}]},
    {id:"cat_2_6",  nombre:"Comunicación en el Deporte",      candidatos:[{nombre:"Asoc. Granadina Periodistas Deportivos"},{nombre:"GranadaDigital Deporte"}]},
    {id:"cat_2_7",  nombre:"Mujer y Deporte",                 candidatos:[{nombre:"Granada CF Femenino"},{nombre:"Pipi Cardell"}]},
    {id:"cat_2_8",  nombre:"Infraestructura Deportiva",       candidatos:[{nombre:"Ciudad Deportiva Diputación Granada"},{nombre:"Complejo Deportivo 'El Hoyo'"}]},
    {id:"cat_2_9",  nombre:"Creación de Conocimiento",        candidatos:[{nombre:"Programa Wadisalud (Guadix + UGR)"},{nombre:"Circuitos BTT Diputación de Granada"}]},
    {id:"cat_2_10", nombre:"Gestión Deportiva Municipal",     candidatos:[{nombre:"Ayuntamiento de Guadix"},{nombre:"Ayuntamiento de Baza"}]},
    {id:"cat_2_11", nombre:"Sostenibilidad en la Gestión",    candidatos:[{nombre:"Cetursa Sierra Nevada S.A."},{nombre:"TerraIncognita Sport – Ultra Sierra Nevada"}]},
    {id:"cat_2_12", nombre:"Deporte para Siempre",            candidatos:[{nombre:"María Pérez García"},{nombre:"Teresa Moya Garciolo"}]},
  ];

  function sanitize(s) { return s.replace(/[.#$\[\]]/g,'_'); }

  function renderResultados(votos, estado, socios) {
    const totalVotos = Object.values(votos).reduce((s,cv)=>s+Object.values(cv).reduce((a,b)=>a+b,0),0);
    const totalSocios = socios ? Object.keys(socios).length : 0;
    document.getElementById('total-votos').textContent  = totalVotos;
    document.getElementById('total-socios').textContent = totalSocios;

    const pill = document.getElementById('estado-pill');
    pill.className = 'estado-pill ' + (estado==='abierta'?'estado-abierta':'estado-cerrada');
    pill.innerHTML = estado==='abierta' ? '<div class="dot-live"></div>En curso' : '🔒 Cerrada';

    const container = document.getElementById('resultados-container');
    container.innerHTML = DEFAULT_CATS.map(cat => {
      const cv = votos[cat.id] || {};
      const total = Object.values(cv).reduce((a,b)=>a+b,0);
      const sorted = [...cat.candidatos].sort((a,b)=>(cv[sanitize(b.nombre)]||0)-(cv[sanitize(a.nombre)]||0));
      const maxV = sorted.length>0?(cv[sanitize(sorted[0].nombre)]||0):0;
      return \`
      <div class="result-cat">
        <div class="result-header">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="background:rgba(255,255,255,.2);border-radius:6px;padding:2px 8px;font-size:12px;color:white;font-weight:700">\${cat.id.replace('cat_','').replace(/_/g,'.')}</span>
            <span class="result-header-title">\${cat.nombre}</span>
          </div>
          <span class="result-header-total">\${total} votos</span>
        </div>
        <div class="result-body">
          \${sorted.map((c,i) => {
            const v = cv[sanitize(c.nombre)]||0;
            const pct = maxV>0?Math.round(v/maxV*100):0;
            const win = i===0&&v>0;
            return \`<div class="result-row">
              <div class="result-row-top">
                <div style="display:flex;align-items:center;gap:8px">
                  \${win?'<span style="font-size:18px">🏆</span>':''}
                  <div style="font-weight:\${win?700:500};font-size:13px;color:\${win?'#1B5E20':'#1A1A1A'}">\${c.nombre}</div>
                </div>
                <div class="result-votes">\${v} votos\${total>0?' · '+Math.round(v/total*100)+'%':''}</div>
              </div>
              <div class="bar-bg"><div class="\${win?'bar bar-win':'bar bar-lose'}" style="width:\${pct}%"></div></div>
            </div>\`;
          }).join('')}
        </div>
      </div>\`;
    }).join('');
  }

  // Suscribir a cambios en tiempo real
  let votosData = {}, estadoData = 'abierta', sociosData = {};
  db.ref('votos').on('value',  s => { votosData  = s.val()||{}; renderResultados(votosData,estadoData,sociosData); });
  db.ref('estado').on('value', s => { estadoData = s.val()||'abierta'; renderResultados(votosData,estadoData,sociosData); });
  db.ref('socios').on('value', s => { sociosData = s.val()||{}; renderResultados(votosData,estadoData,sociosData); });
</script>
</body>
</html>
